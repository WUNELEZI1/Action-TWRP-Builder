name: TWRP Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL (use git@github.com:XXXXX for SSH)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/zyb/tb8786p1_64_k510_wifi'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'tb8786p1_64_k510_wifi'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'omni_tb8786p1_64_k510_wifi'
      BUILD_TARGET:
        description: 'BUILD_TARGET (recoveryimage/vendor_boot/bootimage)'
        required: true
        default: 'recoveryimage'  # 优先编译recoveryimage，适配MTK平板

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # 全局环境变量，避免重复定义
      WORKSPACE_DIR: ${{ github.workspace }}/workspace
      DEVICE_PATH_FULL: ${{ github.workspace }}/workspace/${{ github.event.inputs.DEVICE_PATH }}
      OUTPUT_DIR: ${{ github.workspace }}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
      
    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::Build Configuration"
          echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
          echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: Check Out
        uses: actions/checkout@v4

      - name: System Optimization (Critical for 24.04)
        run: |
          # 修复24.04下的依赖问题
          sudo apt update && sudo apt install -y software-properties-common
          sudo add-apt-repository universe -y
          sudo apt update
          # 清理无用包，释放磁盘空间
          sudo apt purge -y libreoffice* thunderbird* firefox* snapd
          sudo apt autoremove -y && sudo apt clean
          # 增大swap（解决16GB内存不足问题）
          sudo fallocate -l 20G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "/swapfile swap swap defaults 0 0" | sudo tee -a /etc/fstab
          # 验证swap
          swapon --show
          free -h

      - name: Install Build Dependencies (Full & Correct)
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt install -y \
            android-sdk-platform-tools autoconf automake axel bison build-essential \
            ccache clang cmake curl flex g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libtool libxml2 libxml2-utils lzop maven ncftp ninja-build \
            openjdk-11-jdk-headless patch pkg-config pngcrush python3 python3-pip \
            rsync schedtool squashfs-tools sshpass subversion texinfo \
            unzip wget xsltproc yasm zip zlib1g-dev libtinfo5 libncurses6 \
            libstdc++-12-dev gcc-12 g++-12 qemu-user-static
          # 配置ccache加速编译
          echo 'export USE_CCACHE=1' >> ~/.bashrc
          echo 'export CCACHE_EXEC=/usr/bin/ccache' >> ~/.bashrc
          source ~/.bashrc
          ccache -M 50G  # 分配50G缓存

      - name: Install OpenJDK 11 (Fixed for TWRP 12.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk
          cache: gradle

      - name: Setup SSH Keys (If Needed)
        if: startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') || 
            startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
            startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com')
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Repo Tool (Fixed URL & Permissions)
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "export PATH=~/bin:$PATH" >> ~/.bashrc
          source ~/.bashrc
          repo --version  # 验证安装

      - name: Initialize Repo (Optimized for Speed)
        run: |
          mkdir -p $WORKSPACE_DIR
          cd $WORKSPACE_DIR
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          # 浅克隆，加速初始化
          repo init --depth=1 --no-repo-verify -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        id: init_repo

      - name: Repo Sync (Optimized for MTK Device)
        run: |
          cd $WORKSPACE_DIR
          echo "::group::Disk Space Before Sync"
          df -h
          echo "::endgroup::"
          # 优化同步参数，避免超时
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch
          echo "::group::Disk Space After Sync"
          df -h
          echo "::endgroup::"
        env:
          # 解决同步超时问题
          SYNC_TIMEOUT: 1800

      - name: Clone Device Tree (With Error Handling)
        run: |
          echo "::group::Clone Device Tree"
          # 创建设备目录
          mkdir -p $(dirname $DEVICE_PATH_FULL)
          # 克隆设备树（带重试）
          if ! git clone --depth=1 -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_TREE_URL }} $DEVICE_PATH_FULL; then
            echo "第一次克隆失败，重试..."
            git clone -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_TREE_URL }} $DEVICE_PATH_FULL || exit 1
          fi
          # 克隆通用树（如果配置）
          if [ -n "${{ github.event.inputs.COMMON_TREE_URL }}" ] && [ -n "${{ github.event.inputs.COMMON_PATH }}" ]; then
            COMMON_PATH_FULL=$WORKSPACE_DIR/${{ github.event.inputs.COMMON_PATH }}
            mkdir -p $(dirname $COMMON_PATH_FULL)
            git clone --depth=1 -b ${{ github.event.inputs.COMMON_TREE_BRANCH || 'main' }} ${{ github.event.inputs.COMMON_TREE_URL }} $COMMON_PATH_FULL
          fi
          echo "::endgroup::"

      - name: Fix BoardConfig.mk (Critical for MTK)
        run: |
          echo "::group::Fix BoardConfig.mk"
          # 备份原始配置
          cp $DEVICE_PATH_FULL/BoardConfig.mk $DEVICE_PATH_FULL/BoardConfig.mk.bak
          
          # 移除冲突配置（MTK设备关键修复）
          sed -i '/TARGET_NO_RECOVERY/d' $DEVICE_PATH_FULL/BoardConfig.mk
          sed -i '/BOARD_USES_RECOVERY_AS_BOOT/d' $DEVICE_PATH_FULL/BoardConfig.mk
          sed -i '/BOARD_BUILD_VENDOR_BOOT_IMAGE/d' $DEVICE_PATH_FULL/BoardConfig.mk
          sed -i '/AB_OTA_UPDATER/d' $DEVICE_PATH_FULL/BoardConfig.mk
          
          # 强制添加MTK平板必需配置
          cat << EOF >> $DEVICE_PATH_FULL/BoardConfig.mk
          # Added by GitHub Actions (MTK Fix)
          TARGET_BUILD_RECOVERY_IMAGE := true
          TW_MTK := true
          AB_OTA_UPDATER := false
          BOARD_USES_VIRTUAL_AB := false
          TARGET_NO_RECOVERY := false
          BOARD_RECOVERYIMAGE_PARTITION_SIZE := 67108864
          EOF
          echo "✅ BoardConfig.mk fixed for MTK device"
          echo "::endgroup::"

      - name: Build TWRP (Core Logic - Fixed)
        id: build_step
        run: |
          echo "::group::Start Building TWRP"
          cd $WORKSPACE_DIR
          
          # 初始化构建环境
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C  # 解决字符编码问题
          export TZ=UTC    # 统一时区
          
          # 选择构建目标（修复lunch命令）
          LUNCH_CMD="lunch ${INPUT_MAKEFILE_NAME}-eng"
          INPUT_MAKEFILE_NAME=${{ github.event.inputs.MAKEFILE_NAME }}
          echo "Executing: $LUNCH_CMD"
          if ! eval $LUNCH_CMD; then
            echo "❌ Lunch failed! Debug info:"
            find $DEVICE_PATH_FULL -name "*.mk" | xargs cat | grep -i product
            exit 1
          fi
          
          # 构建参数优化（MTK设备用-j2避免内存溢出）
          BUILD_TARGET=${{ github.event.inputs.BUILD_TARGET }}
          echo "Building target: $BUILD_TARGET"
          
          # 执行构建（带错误捕获）
          if make -j2 $BUILD_TARGET 2>&1 | tee build.log; then
            echo "✅ Build succeeded!"
            echo "build_success=true" >> $GITHUB_OUTPUT
            echo "build_target=$BUILD_TARGET" >> $GITHUB_OUTPUT
          else
            echo "❌ Build failed! Last 50 lines of log:"
            tail -50 build.log
            echo "build_success=false" >> $GITHUB_OUTPUT
            echo "build_target=none" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "::endgroup::"

      - name: Verify Build Output
        if: steps.build_step.outputs.build_success == 'true'
        run: |
          echo "::group::Verify Output"
          # 创建输出目录（防止为空）
          mkdir -p $OUTPUT_DIR
          
          # 检查镜像文件
          IMAGE_FILES=$(find $OUTPUT_DIR -name "*.img" -type f | grep -E "(recovery|vendor_boot|boot).img")
          if [ -z "$IMAGE_FILES" ]; then
            echo "⚠️ No valid image files found!"
            ls -la $OUTPUT_DIR
            exit 1
          fi
          
          # 显示镜像信息
          for img in $IMAGE_FILES; do
            echo "✅ Found: $(basename $img) ($(du -h $img | awk '{print $1}'))"
          done
          
          # 生成构建信息
          cat << EOF > $OUTPUT_DIR/build_info.txt
          TWRP Build Info for ${{ github.event.inputs.DEVICE_NAME }}
          ==============================================
          Build Time: $(date -u)
          Manifest: ${{ github.event.inputs.MANIFEST_URL }} (${{ github.event.inputs.MANIFEST_BRANCH }})
          Device Tree: ${{ github.event.inputs.DEVICE_TREE_URL }} (${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Build Target: ${{ steps.build_step.outputs.build_target }}
          GitHub Run ID: ${{ github.run_id }}
          
          Generated Images:
          $(for img in $IMAGE_FILES; do echo "- $(basename $img)"; done)
          EOF
          echo "::endgroup::"

      - name: Upload to GitHub Release
        if: steps.build_step.outputs.build_success == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OUTPUT_DIR }}/*.img
            ${{ env.OUTPUT_DIR }}/build_info.txt
          tag_name: build-${{ github.run_number }}
          name: TWRP-${{ github.event.inputs.DEVICE_NAME }}-build-${{ github.run_number }}
          body: |
            # TWRP Recovery Build for ${{ github.event.inputs.DEVICE_NAME }}
            ## Build Info
            - Device: ${{ github.event.inputs.DEVICE_NAME }}
            - Target: ${{ steps.build_step.outputs.build_target }}
            - Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            - Build Time: $(date -u)
            - Run ID: ${{ github.run_id }}
            
            ## Device Tree
            - URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
            - Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
            
            ## Included Files
            $(for img in $(find ${{ env.OUTPUT_DIR }} -name "*.img" -type f); do echo "- $(basename $img)"; done)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            ${{ env.WORKSPACE_DIR }}/build.log
            ${{ env.DEVICE_PATH_FULL }}/BoardConfig.mk
            ${{ env.OUTPUT_DIR }}/*.txt
          retention-days: 7
