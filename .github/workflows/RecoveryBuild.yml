name: TWRP Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL (use git@github.com:XXXXX for SSH)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/zyb/tb8786p1_64_k510_wifi'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'tb8786p1_64_k510_wifi'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'omni_tb8786p1_64_k510_wifi'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendor_boot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::Build Configuration"
          echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
          echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Setup Disk Space
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "/swapfile swap swap defaults 0 0" | sudo tee -a /etc/fstab
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Prepare the environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup SSH Keys
        if: startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') || 
            startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
            startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com')
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          git config --global user.name "Nico170420"
          git config --global user.email "b170420nc@gmail.com"
          repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        id: pwd

      - name: Repo Sync
        run: |
          echo "Checking disk space before sync:"
          df -h
          repo sync -j4 --force-sync --no-clone-bundle --optimized-fetch
          echo "Checking disk space after sync:"
          df -h
        working-directory: workspace

      - name: Clone and Build
        run: |
          echo "=== TWRP Recovery Builder ==="
          echo "Device: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "======================================"
        
          echo ""
          echo "=== Step 1: Clone Device Tree ==="
          DEVICE_PATH="./${{ github.event.inputs.DEVICE_PATH }}"
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} "$DEVICE_PATH" 
          if [ $? -ne 0 ]; then
            echo "❌ Failed to clone device tree"
            exit 1
          fi
          echo "✅ Device tree cloned successfully" 
        
          echo ""
          echo "=== Step 2: 验证关键配置文件 ==="
          for file in Android.mk BoardConfig.mk twrp.mk recovery.fstab; do
            if [ -f "$DEVICE_PATH/$file" ]; then
              echo "✅ Found: $file"
              # 特殊检查 BoardConfig.mk
              if [ "$file" = "BoardConfig.mk" ]; then
                echo "   Checking for problematic configurations..."
                if grep -q "BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT\|BOARD_BUILD_VENDOR_BOOT_IMAGE" "$DEVICE_PATH/$file"; then
                  echo "   ⚠️  Found problematic configs, they should be removed."
                fi
              fi
            else
              echo "⚠️  Missing: $file"
            fi
          done
        
          echo ""
          echo "=== Step 3: 初始化构建环境 ==="
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
        
          echo ""
          echo "=== Step 3.5: 设置关键环境变量 (绕过早期检查) ==="
          # 这些变量在 lunch 命令读取配置之前设置，可以影响构建系统的初始状态
          export TARGET_NO_RECOVERY=true
          export TARGET_RECOVERY_IS_VENDOR_BOOT=true
        
          echo ""
          echo "=== Step 4: 选择构建目标 ==="
          if ! lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng; then
            echo "❌ lunch 失败，尝试调试..."
            echo ""
            echo "=== 调试：检查产品配置 ==="
            find . -name "*${{ github.event.inputs.DEVICE_NAME }}*.mk" -type f | head -5
            echo ""
            echo "=== 调试：检查 make 变量 ==="
            # 尝试直接调用 get_build_var 看看失败原因
            make showcommands > /dev/null 2>&1 || true
            exit 1
          fi
        
          echo "✅ Selected: lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng"
          echo "TARGET_PRODUCT: $TARGET_PRODUCT"
          echo "TARGET_DEVICE: $TARGET_DEVICE"
        
          echo ""
          echo "=== Step 5: 检查构建变量 ==="
          echo "关键变量状态:"
          for var in AB_OTA_UPDATER AB_OTA_PARTITIONS TARGET_NO_RECOVERY BOARD_USES_RECOVERY_AS_BOOT; do
            value=$(get_build_var $var 2>/dev/null || echo "(未定义)")
            echo "  $var: $value"
          done
        
          echo ""
          echo "=== Step 6: 执行构建 ==="
          echo "开始构建: $(date)"
          BUILD_START=$(date +%s)
        
          # 关键变更：使用更通用的构建目标
          # 'mka' 可能因环境问题失败，使用 'make' 并指定并行数
          echo ""
          echo "📦 构建策略: 使用 'make recoveryimage' (TWRP 标准目标)"
          echo "构建命令: make -j4 recoveryimage 2>&1 | tee build.log"
        
          if make -j4 recoveryimage 2>&1 | tee build.log; then
            BUILD_RESULT="success"
            BUILD_TARGET="recoveryimage"
            echo "✅ 第一阶段构建成功"
        
            # 尝试专门构建 vendor_boot 作为第二目标
            echo ""
            echo "📦 第二阶段: 尝试构建 vendor_boot"
            if make -j4 vendor_boot 2>&1 | tee -a build.log; then
              echo "✅ vendor_boot 构建成功"
            else
              echo "⚠️  vendor_boot 构建失败，但 recoveryimage 已成功"
            fi
          else
            echo "❌ recoveryimage 构建失败"
            echo ""
            echo "=== 错误分析 ==="
            tail -30 build.log | grep -i "error\|fail\|stop\|missing" || tail -20 build.log
        
            # 备选方案：尝试构建 boot
            echo ""
            echo "🔄 备选方案: 尝试构建 bootimage"
            if make -j4 bootimage 2>&1 | tee -a build.log; then
              BUILD_RESULT="success"
              BUILD_TARGET="bootimage"
              echo "✅ bootimage 构建成功"
            else
              BUILD_RESULT="failure"
              echo "❌ 所有构建尝试均失败"
              exit 1
            fi
          fi
        
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
        
          echo ""
          echo "=== Step 7: 检查构建输出 ==="
          OUTPUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        
          if [ -d "$OUTPUT_DIR" ]; then
            echo "✅ 找到输出目录: $OUTPUT_DIR"
            echo ""
            echo "生成的镜像文件:"
            find "$OUTPUT_DIR" -name "*.img" -type f 2>/dev/null | while read img; do
              img_size=$(stat -c%s "$img" 2>/dev/null || echo "0")
              size_mb=$((img_size / 1024 / 1024))
              echo "  - $(basename "$img") (${size_mb}MB)"
            done || echo "  未找到 .img 文件"
        
            echo ""
            echo "其他重要文件:"
            ls -la "$OUTPUT_DIR/" | grep -E "(.img|.zip|.md5|kernel|dtb)" || echo "  无相关文件"
          else
            echo "⚠️  输出目录不存在: $OUTPUT_DIR"
            echo "检查构建日志中是否有更早的错误..."
          fi
        
          echo ""
          echo "=== 构建总结 ==="
          if [ "$BUILD_RESULT" = "success" ]; then
            echo "✅ 构建成功!"
            echo "   构建目标: $BUILD_TARGET"
            echo "   构建时间: ${BUILD_TIME}秒"
            echo "   输出目录: $OUTPUT_DIR"
          else
            echo "❌ 构建失败"
            echo "   查看 build.log 获取详细信息"
          fi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      - name: Verify Build Output
        run: |
          OUTPUT_PATH="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          echo "Checking build output in $OUTPUT_PATH"
          
          if [ -d "$OUTPUT_PATH" ]; then
            echo "Contents of $OUTPUT_PATH:"
            ls -la "$OUTPUT_PATH/" 2>/dev/null || echo "Cannot list directory"
            
            echo ""
            echo "=== Looking for image files ==="
            
            # 查找所有可能的镜像文件
            IMAGE_FILES=$(find "$OUTPUT_PATH" -name "*.img" -type f 2>/dev/null)
            
            if [ -n "$IMAGE_FILES" ]; then
              echo "Found image files:"
              echo "$IMAGE_FILES" | while read -r file; do
                size=$(ls -lh "$file" | awk '{print $5}')
                echo "  📄 $(basename "$file") - $size"
              done
              
              # 检查特定文件
              for img in "vendor_boot.img" "vendorboot.img" "boot.img" "recovery.img"; do
                if [ -f "$OUTPUT_PATH/$img" ]; then
                  echo ""
                  echo "✅ SUCCESS: $img created"
                  echo "File size: $(ls -lh "$OUTPUT_PATH/$img" | awk '{print $5}')"
                  echo "File path: $OUTPUT_PATH/$img"
                fi
              done
            else
              echo "❌ No image files found"
              echo "Directory listing:"
              find "$OUTPUT_PATH" -type f 2>/dev/null | head -20
            fi
          else
            echo "❌ Output directory not found: $OUTPUT_PATH"
          fi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Prepare Release Files
        run: |
          OUTPUT_PATH="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          
          if [ -d "$OUTPUT_PATH" ]; then
            echo "Preparing release files..."
            
            BUILD_INFO_FILE="$OUTPUT_PATH/build_info.txt"
            echo "TWRP Recovery Build" > "$BUILD_INFO_FILE"
            echo "===================" >> "$BUILD_INFO_FILE"
            echo "Device: ${{ github.event.inputs.DEVICE_NAME }}" >> "$BUILD_INFO_FILE"
            echo "Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}" >> "$BUILD_INFO_FILE"
            echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img" >> "$BUILD_INFO_FILE"
            echo "Build ID: ${{ github.run_id }}" >> "$BUILD_INFO_FILE"
            echo "Date: $(date)" >> "$BUILD_INFO_FILE"
            echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE_URL }}" >> "$BUILD_INFO_FILE"
            
            echo "Build info saved to $BUILD_INFO_FILE"
            echo "Release files ready"
          fi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendorboot.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/boot.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/build_info.txt
          name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            TWRP Recovery Build for ${{ github.event.inputs.DEVICE_NAME }}
            
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: ${{ github.event.inputs.DEVICE_NAME }}
            Target: ${{ github.event.inputs.BUILD_TARGET }}.img
            Build ID: ${{ github.run_id }}
            
            Device Tree: ${{ github.event.inputs.DEVICE_TREE_URL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
