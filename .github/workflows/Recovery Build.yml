name: TWRP Build for tb8786p1_64_k510_wifi
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 清理并安装依赖
        run: |
          # 清理冗余包释放空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          # 更新并安装编译必需依赖
          sudo apt update && sudo apt install -y \
            git ccache python3 openjdk-11-jdk \
            gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev \
            liblz4-tool imagemagick lzop

      - name: 配置repo工具
        run: |
          mkdir -p ~/bin
          # 使用清华源加速repo下载
          curl -fsSL https://mirrors.tuna.tsinghua.edu.cn/git/git-repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH="$HOME/bin:$PATH"

      - name: 同步源码并修复核心语法错误
        run: |
          export PATH="$HOME/bin:$PATH"
          
          # 创建编译目录（用户目录，无权限问题）
          mkdir -p $HOME/twrp
          cd $HOME/twrp
          
          # 初始化TWRP 12.1源码（深度1，加速同步）
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1
          repo sync -j$(nproc) --no-clone-bundle --optimized-fetch
          
          # 克隆你的设备树（替换为实际仓库地址）
          git clone https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi device/zyb/tb8786p1_64_k510_wifi
          # ========== 唯一核心修复：解决export废弃语法 ==========
          # 1. 删除vendor/twrp/config/common.mk中废弃的export行
          sed -i '/export PRODUCT_PROPERTY_OVERRIDES/d' vendor/twrp/config/common.mk
          # 2. 将覆盖赋值改为追加赋值，避免变量冲突
          sed -i 's/^PRODUCT_PROPERTY_OVERRIDES :=/PRODUCT_PROPERTY_OVERRIDES +=/g' vendor/twrp/config/common.mk
          # 3. 同步修复设备树中的同类写法（防止后续冲突）
          sed -i 's/^PRODUCT_PROPERTY_OVERRIDES :=/PRODUCT_PROPERTY_OVERRIDES +=/g' device/zyb/tb8786p1_64_k510_wifi/*.mk

      - name: 编译TWRP镜像
        run: |
          cd $HOME/twrp
          
          # 配置ccache加速编译
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export ALLOW_MISSING_DEPENDENCIES=true
          ccache -M 20G
          
          # 加载编译环境
          source build/envsetup.sh
          # 选择设备编译目标（你的命名完全正确）
          lunch omni_tb8786p1_64_k510_wifi-eng
          # 编译vendor_boot和boot镜像
          make -j$(nproc) vendor_bootimage bootimage 2>&1 | tee build.log

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: tb8786p1_64_k510_wifi-twrp
          path: |
            $HOME/twrp/out/target/product/tb8786p1_64_k510_wifi/*.img
            $HOME/twrp/build.log
          retention-days: 7
