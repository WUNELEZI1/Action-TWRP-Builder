name: TWRP Build for tb8786p1_64_k510_wifi (Vendor Boot)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/zyb/tb8786p1_64_k510_wifi

      - name: Free Disk Space
        run: |
          echo "🧹 Freeing disk space..."
          sudo apt purge -y --auto-remove -qq dotnet* mono* llvm* android* ghc* powershell* libreoffice* thunderbird* firefox* chrome* docker* lxd* snapd*
          sudo rm -rf /var/lib/apt/lists/* /var/log/* /tmp/* ~/.cache/* /var/cache/*
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/miniconda
          df -h

      - name: Install Dependencies
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo apt update -qq
          sudo apt install -y -qq git python3 openjdk-11-jdk-headless gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev liblz4-tool lzop make repo ninja-build curl unzip dos2unix rsync bc libxml2-utils xsltproc zip libncurses5 libncursesw5 libc6-dev-i386 libssl-dev liblz4-dev libz-dev python3-distutils python3-pip
          sudo apt clean

      - name: Sync TWRP Source + Device Tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/twrp
          cd ~/twrp

          # 配置 Git 用户名
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 🔑 关键：配置 Git 使用 GITHUB_TOKEN 进行认证
          git config --global credential.helper store
          echo "https://$GITHUB_TOKEN:@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

          # 初始化 repo（现在可以无密码访问）
          repo init --depth=1 \
            -u https://github.com/TeamWin/platform_manifest_twrp_aosp \
            -b twrp-12.1 \
            --no-repo-verify

          # 复制设备树
          mkdir -p device/zyb
          cp -r $GITHUB_WORKSPACE/device/zyb/tb8786p1_64_k510_wifi device/zyb/

          # 同步源码
          repo sync -c --force-sync --no-clone-bundle --optimized-fetch --prune -j$(nproc)

      - name: Setup Build & Lunch
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch omni_tb8786p1_64_k510_wifi-eng

      - name: Build vendor_boot.img (NOT recovery.img!)
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch omni_tb8786p1_64_k510_wifi-eng
          
          # 🔥 关键：必须用 vendor_bootimage，不是 recoveryimage！
          mka vendor_bootimage -j$(nproc)

      - name: Collect Artifacts
        run: |
          cd ~/twrp
          OUT=out/target/product/tb8786p1_64_k510_wifi
          mkdir -p artifacts

          if [ -f "$OUT/vendor_boot.img" ]; then
            cp "$OUT/vendor_boot.img" artifacts/
            echo "✅ SUCCESS: vendor_boot.img built!"
          else
            echo "❌ FAILED: vendor_boot.img not found!"
            ls -la "$OUT/"
            exit 1
          fi

          # Optional: also collect boot.img (in case fallback needed)
          [ -f "$OUT/boot.img" ] && cp "$OUT/boot.img" artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-vendor_boot-for-tb8786p1_64_k510_wifi
          path: ~/twrp/artifacts
          retention-days: 30

      - name: Final Instructions
        if: always()
        run: |
          echo "=============================================="
          echo "📱 DEVICE: ZYB ZPD1321 (MT6768, Android 13)"
          echo "📦 OUTPUT: vendor_boot.img (contains TWRP)"
          echo ""
          echo "🔧 Flash command (A/B slot aware):"
          echo "fastboot flash vendor_boot_a vendor_boot.img"
          echo "fastboot flash vendor_boot_b vendor_boot.img"
          echo ""
          echo "🔄 Reboot to TWRP:"
          echo "fastboot reboot recovery"
          echo "=============================================="
