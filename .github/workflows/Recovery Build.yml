name: TWRP Build for tb8786p1_64_k510_wifi
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检查环境
        run: |
          echo "========================================"
          echo "📌 ENV INFO - $(date)"
          echo "========================================"
          cat /etc/os-release
          uname -a
          lscpu | grep -E "Model name|CPU\(s\)"
          free -h
          df -h --total | grep -E "Filesystem|total"
          echo "GCC: $(gcc --version | head -1)"
          echo "Python3: $(python3 --version)"
          echo "Java: $(java --version 2>&1 | head -1)"
          echo "========================================"

      - name: 深度清理磁盘
        run: |
          echo "========================================"
          df -h
          echo "----------------------------------------"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda /usr/local/lib/node_modules /usr/local/games /usr/games
          sudo docker system prune -a -f --volumes
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/* /var/log/* /tmp/* ~/.cache/*
          sudo swapoff -a && sudo swapon -a
          echo "----------------------------------------"
          df -h
          echo "========================================"

      - name: 安装依赖
        run: |
          echo "========================================"
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo apt update -y
          sudo apt install -y --no-install-recommends git python3 openjdk-11-jdk-headless gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev liblz4-tool imagemagick lzop make repo
          sudo apt clean
          git --version
          python3 --version
          java -version
          echo "========================================"

      - name: 同步源码
        run: |
          echo "========================================"
          sudo mkdir -p /mnt/twrp
          sudo chown -R runner:runner /mnt/twrp
          cd /mnt/twrp
          echo $(pwd)
          echo "----------------------------------------"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1 --no-repo-verify 2>&1 | grep -v -E "new version of repo|launcher is not writable"
          repo sync -j4 --no-clone-bundle --optimized-fetch --no-tags 2>&1 | grep -v -E "new version of repo|launcher is not writable"
          echo "✅ 源码同步完成！"
          git clone --depth=1 https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi device/zyb/tb8786p1_64_k510_wifi
          
          # 验证设备树配置文件（新增检查Products.mk）
          if [ -f "device/zyb/tb8786p1_64_k510_wifi/AndroidProducts.mk" ] && [ -f "device/zyb/tb8786p1_64_k510_wifi/omni_tb8786p1_64_k510_wifi.mk" ] && [ -f "device/zyb/tb8786p1_64_k510_wifi/BoardConfig.mk" ]; then
            echo "✅ 设备树核心配置文件存在"
          else
            echo "❌ 设备树配置文件缺失（需AndroidProducts.mk/omni_xxx.mk/BoardConfig.mk）"
            exit 1
          fi
          
          mkdir -p .repo/local_manifests
          echo '<?xml version="1.0" encoding="UTF-8"?><manifest><project path="device/zyb/tb8786p1_64_k510_wifi" name="WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi" remote="github" revision="main" /></manifest>' > .repo/local_manifests/roomservice.xml
          echo "========================================"

      - name: 编译镜像（用lunch加载设备树）
        run: |
          echo "========================================"
          echo "🔨 BUILD START - $(date)"
          cd /mnt/twrp
          # 基础环境配置
          export ALLOW_MISSING_DEPENDENCIES=true
          export ANDROID_JACK_VM_ARGS="-Xmx8g"
          export LC_ALL=C
          export BUILD_START_TIME=$(date +%s)
          
          echo "📋 编译前磁盘状态："
          df -h /mnt
          
          # 加载环境并执行lunch（关键：加载你的设备树）
          echo "🔧 加载编译环境..."
          source build/envsetup.sh
          echo "✅ 环境加载完成，执行lunch选择设备..."
          lunch omni_tb8786p1_64_k510_wifi-eng 2>&1 | tee -a lunch.log
          
          # 心跳日志
          echo "🚀 开始编译（-j2，适配MTK设备）- $(date)"
          (
            while true; do
              ELAPSED=$(( $(date +%s) - BUILD_START_TIME ))
              DISK=$(df -h /mnt | grep /mnt | awk '{print $4}')
              CPU=$(uptime | awk '{print $10 $11 $12}')
              echo "❤️ 编译中（已运行${ELAPSED}秒）- 磁盘可用：${DISK} - CPU负载：${CPU}"
              sleep 10
            done
          ) &
          HEARTBEAT_PID=$!
          
          # 编译TWRP核心产物
          mka recoveryimage vendorbootimage 2>&1 | tee -a build.log
          
          # 停止心跳日志
          kill $HEARTBEAT_PID
          
          echo "----------------------------------------"
          echo "✅ BUILD END - $(date)"
          echo "⏱️  总耗时：$(( $(date +%s) - BUILD_START_TIME ))s"
          
          # 检查产物
          echo "📦 检查编译产物："
          if [ -d "out/target/product/tb8786p1_64_k510_wifi" ]; then
            ls -lh out/target/product/tb8786p1_64_k510_wifi/
            if ls out/target/product/tb8786p1_64_k510_wifi/vendor_boot.img 1> /dev/null 2>&1; then
              echo "🎉 编译成功！生成TWRP核心镜像：vendor_boot.img"
              ls -lh out/target/product/tb8786p1_64_k510_wifi/vendor_boot.img
            else
              echo "⚠️  未生成vendor_boot.img，查看日志末尾："
              tail -100 build.log
            fi
          else
            echo "❌ 产物目录不存在"
          fi
          echo "========================================"

      - name: 上传产物（含日志）
        uses: actions/upload-artifact@v4
        with:
          name: tb8786p1_64_k510_wifi-twrp
          path: |
            /mnt/twrp/out/target/product/tb8786p1_64_k510_wifi/*.img
            /mnt/twrp/build.log
            /mnt/twrp/lunch.log
          retention-days: 7
