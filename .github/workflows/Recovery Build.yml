name: TWRP Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Manifest URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'Manifest branch'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'Device tree URL'
        required: true
        default: 'https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device tree path'
        required: true
        default: 'device/zyb/tb8786p1_64_k510_wifi'
      DEVICE_NAME:
        description: 'Device name'
        required: true
        default: 'tb8786p1_64_k510_wifi'
      MAKEFILE_NAME:
        description: 'Makefile name'
        required: true
        default: 'omni_tb8786p1_64_k510_wifi'
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'vendor_boot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Display Project Information
      run: |
        echo "=== TWRP Recovery Builder Project ==="
        echo "Repository: ${{ github.repository }}"
        echo "Workflow: ${{ github.workflow }}"
        echo "Run ID: ${{ github.run_id }}"
        echo "Run Number: ${{ github.run_number }}"
        echo "Triggered by: ${{ github.triggering_actor }}"
        echo "Event: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"
        echo "====================================="
        
    - name: Display Build Parameters
      run: |
        echo "::group::Build Parameters"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clean Workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python3-pip python-is-python3 \
            repo rsync schedtool squashfs-tools bc ccache automake lzop \
            p7zip-full libtinfo5 libssl-dev

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: startsWith(github.event.inputs.MANIFEST_URL, 'git@') || startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@')
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install Repo Tool
      run: |
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo
        echo "export PATH=~/.bin:$PATH" >> ~/.bashrc
        source ~/.bashrc

    - name: Initialize Repo
      run: |
        mkdir -p workspace
        cd workspace
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
        echo "workspace_dir=$(pwd)" >> $GITHUB_OUTPUT
      id: init_repo

    - name: Sync Source
      run: |
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
      working-directory: ${{ steps.init_repo.outputs.workspace_dir }}

    - name: Clone Device Tree
      run: |
        echo "Cloning device tree..."
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}
        echo "Device tree cloned successfully"
        ls -la ${{ github.event.inputs.DEVICE_PATH }}/
      working-directory: ${{ steps.init_repo.outputs.workspace_dir }}

    - name: Setup Build Environment Script
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        echo "Build environment setup complete"
      working-directory: ${{ steps.init_repo.outputs.workspace_dir }}

    - name: Select Device Target
      run: |
        echo "Selecting device target..."
        if breakfast twrp_${{ github.event.inputs.DEVICE_NAME }}-eng; then
          echo "Selected: breakfast twrp_${{ github.event.inputs.DEVICE_NAME }}-eng"
        elif breakfast omni_${{ github.event.inputs.DEVICE_NAME }}-eng; then
          echo "Selected: breakfast omni_${{ github.event.inputs.DEVICE_NAME }}-eng"
        elif lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng; then
          echo "Selected: lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng"
        else
          echo "Failed to select device target"
          exit 1
        fi
      working-directory: ${{ steps.init_repo.outputs.workspace_dir }}

    - name: Build Recovery
      run: |
        echo "Starting build..."
        mka ${{ github.event.inputs.BUILD_TARGET }}
        echo "Build completed"
      working-directory: ${{ steps.init_repo.outputs.workspace_dir }}

    - name: Check Build Output
      run: |
        OUTPUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        echo "Checking build output in: $OUTPUT_DIR"
        
        if [ -d "$OUTPUT_DIR" ]; then
          echo "Build output directory exists"
          ls -la "$OUTPUT_DIR/"
          
          IMAGE_FILE="$OUTPUT_DIR/${{ github.event.inputs.BUILD_TARGET }}.img"
          if [ -f "$IMAGE_FILE" ]; then
            echo "Build successful! Image file: $IMAGE_FILE"
            echo "File size: $(ls -lh "$IMAGE_FILE" | awk '{print $5}')"
          else
            echo "Target image not found. Available files:"
            find "$OUTPUT_DIR" -name "*.img" -o -name "*.zip" | xargs -I {} basename {}
          fi
        else
          echo "Build output directory not found"
        fi
      working-directory: ${{ steps.init_repo.outputs.workspace_dir }}

    - name: Create Release Notes
      run: |
        OUTPUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        mkdir -p "$OUTPUT_DIR"
        
        cat > "$OUTPUT_DIR/release_notes.txt" << 'EOF'
TWRP Recovery Build for ${{ github.event.inputs.DEVICE_NAME }}
===========================================================

Build Information:
- Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
- Device: ${{ github.event.inputs.DEVICE_NAME }}
- Target: ${{ github.event.inputs.BUILD_TARGET }}.img
- Build ID: ${{ github.run_id }}
- Date: $(date)

Device Tree: ${{ github.event.inputs.DEVICE_TREE_URL }}

Flashing Instructions:
1. Enable USB debugging and OEM unlocking
2. Boot device to fastboot mode
3. Flash vendor boot:
   fastboot flash vendor_boot vendor_boot.img
4. Reboot to recovery
EOF
        
        echo "Release notes created"
      working-directory: ${{ steps.init_repo.outputs.workspace_dir }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.init_repo.outputs.workspace_dir }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          ${{ steps.init_repo.outputs.workspace_dir }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/release_notes.txt
        name: TWRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
        tag_name: build-${{ github.run_number }}
        body: |
          TWRP Recovery for ${{ github.event.inputs.DEVICE_NAME }}
          
          Build Information:
          - Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          - Device: ${{ github.event.inputs.DEVICE_NAME }}
          - Target: ${{ github.event.inputs.BUILD_TARGET }}.img
          - Build ID: ${{ github.run_id }}
          
          Device Tree: ${{ github.event.inputs.DEVICE_TREE_URL }}
          
          Flashing Instructions:
          1. Enable USB debugging and OEM unlocking
          2. Boot device to fastboot mode
          3. Flash vendor boot:
             fastboot flash vendor_boot vendor_boot.img
          4. Reboot to recovery
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
