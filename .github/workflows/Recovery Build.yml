name: TWRP Builder
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 系统环境清理与初始化
        run: |
          # 深度清理系统无用文件，释放磁盘空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/local/graalvm /usr/local/.ghcup /usr/local/boost
          sudo apt clean
          sudo apt autoclean
          sudo apt autoremove -y --purge
          
          # 清理Docker镜像和缓存（如果存在）
          if command -v docker &> /dev/null; then
            sudo docker system prune -af
          fi
          
          # 清理临时文件
          sudo rm -rf /tmp/* /var/tmp/*
          sudo find /var/log -type f -name "*.log" -delete
          
          # 更新并安装依赖
          sudo apt update -y && sudo apt install -y git ccache python3 openjdk-11-jdk gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev liblz4-tool imagemagick lzop
          
          # 配置repo工具
          mkdir -p ~/bin
          curl -fsSL https://mirrors.tuna.tsinghua.edu.cn/git/git-repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo 'export PATH="$HOME/bin:$PATH"' >> ~/.bashrc
          source ~/.bashrc
          
          # 配置Java环境
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          
          # 调整系统限制
          ulimit -n 65535
          
          # 显示系统资源状态
          echo "=== 内存状态 ==="
          free -h
          echo "=== 磁盘状态 ==="
          df -h
          echo "=== CPU核心数 ==="
          nproc

      - name: 源码同步（优化存储路径）
        run: |
          export PATH="$HOME/bin:$PATH"
          
          # 使用/mnt分区（更大的磁盘空间）作为构建目录
          sudo mkdir -p /mnt/twrp-build
          sudo chown -R $USER:$USER /mnt/twrp-build
          cd /mnt/twrp-build
          
          # 初始化repo（使用清华镜像加速）
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1 --no-repo-verify
          
          # 优化同步参数，减少内存和磁盘占用
          repo sync -j$(nproc --all) --no-clone-bundle --optimized-fetch --quiet --force-sync
          
          # 克隆设备树
          git clone https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi -b main device/zyb/tb8786p1_64_k510_wifi --depth=1
          
          # 创建必要目录
          mkdir -p device/zyb/tb8786p1_64_k510_wifi/prebuilt device/zyb/tb8786p1_64_k510_wifi/dtb device/zyb/tb8786p1_64_k510_wifi/sepolicy/{public,private}
          
          # ========== 关键修复1：创建最小有效文件（避免空文件编译错误） ==========
          # 创建最小的内核文件（避免编译时找不到文件）
          echo -n "dummy" > device/zyb/tb8786p1_64_k510_wifi/prebuilt/Image.gz-dtb
          echo -n "dummy" > device/zyb/tb8786p1_64_k510_wifi/dtb/mt6768.dtb
          # 确保fstab文件存在
          cp device/zyb/tb8786p1_64_k510_wifi/recovery.fstab device/zyb/tb8786p1_64_k510_wifi/recovery.fstab
          
          # ========== 关键修复2：彻底解决只读变量问题 ==========
          # 方法1：修改vendor/twrp/config/common.mk，完全重置变量
          if [ -f "vendor/twrp/config/common.mk" ]; then
            # 在文件最开头插入变量重置
            sudo sed -i '1i\# Force unlock readonly variable\nPRODUCT_PROPERTY_OVERRIDES :=\nexport PRODUCT_PROPERTY_OVERRIDES\n\n' vendor/twrp/config/common.mk
            # 将所有 := 改为 +=
            sudo sed -i 's/^PRODUCT_PROPERTY_OVERRIDES :=/PRODUCT_PROPERTY_OVERRIDES +=/g' vendor/twrp/config/common.mk
            echo "✅ 已修复vendor/twrp/config/common.mk中的变量只读问题"
            # 验证修改结果
            head -10 vendor/twrp/config/common.mk
          fi
          
          # 方法2：修改设备树中的所有mk文件
          find device/zyb/tb8786p1_64_k510_wifi -name "*.mk" -type f | while read file; do
            sudo sed -i 's/^PRODUCT_PROPERTY_OVERRIDES :=/PRODUCT_PROPERTY_OVERRIDES +=/g' "$file"
            echo "✅ 已修复 $file 中的变量赋值问题"
          done
          
          # 提前创建ccache目录并设置权限（解决权限问题）
          sudo mkdir -p /mnt/ccache
          sudo chown -R $USER:$USER /mnt/ccache
          
          # 再次检查磁盘空间
          echo "=== 同步后磁盘状态 ==="
          df -h

      - name: 构建TWRP（优化构建参数+内存优化）
        run: |
          export PATH="$HOME/bin:$PATH"
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          
          # 进入构建目录
          cd /mnt/twrp-build
          
          # 配置ccache缓存（放到/mnt分区，已提前创建并授权）
          export ALLOW_MISSING_DEPENDENCIES=true 
          export USE_CCACHE=1 
          export CCACHE_DIR=/mnt/ccache
          export CCACHE_EXEC=/usr/bin/ccache
          
          # 限制ccache大小为15G（适配内存限制）
          ccache -M 15G && ccache -z && ccache -s
          
          # 优化JVM和构建参数（降低内存占用）
          export ANDROID_JACK_VM_ARGS="-Xmx3g -Dfile.encoding=UTF-8 -XX:+TieredCompilation"
          export BUILD_USERNAME=github
          export BUILD_HOSTNAME=actions
          export TMPDIR=/mnt/tmp
          mkdir -p $TMPDIR
          
          # ========== 终极保障：全局解锁变量 ==========
          # 创建全局配置文件
          cat > build/make/core/unlock_vars.mk << EOF
          # Force unlock PRODUCT_PROPERTY_OVERRIDES
          PRODUCT_PROPERTY_OVERRIDES :=
          export PRODUCT_PROPERTY_OVERRIDES
          EOF
          
          # 将全局配置加入构建
          export EXTRA_BUILD_CONFIG=build/make/core/unlock_vars.mk
          
          # 加载构建环境
          source build/envsetup.sh
          lunch omni_tb8786p1_64_k510_wifi-eng
          
          # 使用最低并行数，确保内存足够
          make -j1 recoveryimage 2>&1 | tee build.log
          
          # 显示构建结果
          ls -lh out/target/product/tb8786p1_64_k510_wifi/*.img || echo "构建产物未找到"

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: twrp-img
          path: |
            /mnt/twrp-build/out/target/product/tb8786p1_64_k510_wifi/*.img
            /mnt/twrp-build/build.log
          retention-days: 7  # 设置产物保留7天
          
      - name: 构建失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            /mnt/twrp-build/build.log
            /mnt/twrp-build/out/**/*.log
            /mnt/twrp-build/vendor/twrp/config/common.mk
            /mnt/twrp-build/device/zyb/tb8786p1_64_k510_wifi/*.mk
          retention-days: 7
          if-no-files-found: warn
