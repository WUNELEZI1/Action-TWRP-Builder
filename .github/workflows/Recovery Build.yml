name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-14'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/zyb/tb8786p1_64_k510_wifi'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'tb8786p1_64_k510_wifi'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_tb8786p1_64_k510_wifi'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendor_boot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v4

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      # That's it! Now use your normal steps

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') || 
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        rm -rf workspace
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace
    - name: PATCH TWRP-14 - Add missing vendor_boot support
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
    
        echo "=== Patching TWRP-14 to restore vendorbootimage ==="
    
  
        git clone https://android.googlesource.com/platform/build/make build/make --depth 1 || true
    
  
        cat > build/make/core/vendor_boot.mk << 'EOF'
        INSTALLED_VENDOR_BOOTIMAGE_TARGET := $(PRODUCT_OUT)/vendor_boot.img
        $(INSTALLED_VENDOR_BOOTIMAGE_TARGET): $(MKBOOTIMG) \
            $(recovery_ramdisk) \
            $(INSTALLED_DTBIMAGE_TARGET)
        $(call pretty,"Target vendor boot image: $@")
        $(MKBOOTIMG) --vendor_cmdline "$(BOARD_KERNEL_CMDLINE)" \
            --base $(BOARD_KERNEL_BASE) \
            --pagesize $(BOARD_KERNEL_PAGESIZE) \
            --ramdisk_offset $(BOARD_RAMDISK_OFFSET) \
            --tags_offset $(BOARD_KERNEL_TAGS_OFFSET) \
            --dtb_offset $(BOARD_DTB_OFFSET) \
            --header_version $(BOARD_BOOT_HEADER_VERSION) \
            --vendor_ramdisk $< \
            --dtb $(INSTALLED_DTBIMAGE_TARGET) \
            --output $@
        EOF
        if ! grep -q "vendor_boot.mk" build/make/core/Makefile; then
          echo "include build/make/core/vendor_boot.mk" >> build/make/core/Makefile
        fi
    
    
        echo "=== Patch complete ==="
    - name: Clone device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != null
        && github.event.inputs.COMMON_PATH != null
      run: |
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check Build Tree
      uses: haya14busa/action-cond@v1
      id: buildtree
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
        if_true: twrp
        if_false: omni

    - name: Sync Device Dependencies
      run: |
        bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ github.event.inputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies
        repo sync -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12
    - name: Check lunch version
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        source build/envsetup.sh
    
        echo "=== Lunch version info ==="
  
        type lunch
    
    
        lunch -h 2>/dev/null || true
    
   
        echo "=== Available products ==="
        list_products 2>/dev/null || echo "list_products not available"
    

        echo "=== Available releases ==="
        list_releases 2>/dev/null || echo "list_releases not available"
    - name: Diagnose Build System
      run: |
      
        cd ${{ steps.pwd.outputs.workspace-folder }}
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true    
        DEVICE="${{ github.event.inputs.DEVICE_NAME }}"    
        echo "=== Setting up build environment ==="
        breakfast "twrp_${DEVICE}-eng"
        echo "========== 1. SYSTEM INFORMATION =========="
        echo "Android Version: $(get_build_var PLATFORM_VERSION)"
        echo "Build ID: $(get_build_var BUILD_ID)"
        echo "TARGET_PRODUCT: $(get_build_var TARGET_PRODUCT)"
        echo ""
        
        echo "========== 2. DEVICE CONFIGURATION =========="
        echo "BoardConfig.mk location:"
        ls -la device/zyb/$DEVICE/BoardConfig.mk || true
        echo ""
        echo "BOARD_VENDOR_BOOT: $(get_build_var BOARD_VENDOR_BOOT)"
        echo "BOARD_BOOT_HEADER_VERSION: $(get_build_var BOARD_BOOTLOADER_HEADER_VERSION)"
        echo "BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE: $(get_build_var BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE)"
        echo "BOARD_VENDOR_BOOT_DTB_SIZE: $(get_build_var BOARD_VENDOR_BOOT_DTB_SIZE)"
        echo "BOARD_VENDOR_RAMDISK_TYPE: $(get_build_var BOARD_VENDOR_RAMDISK_TYPE)"
        echo ""
        
        echo "========== 3. MAKE HELP - ALL TARGETS =========="
        echo "Total make targets (first 50):"
        make help | head -100 | grep -E "^[a-zA-Z]" | sort | uniq | head -50
        echo ""
        
        echo "========== 4. VENDOR_BOOT RELATED TARGETS =========="
        echo "Searching for vendor_boot/vendorboot/vendor-boot targets:"
        make help | grep -E "vendor.*boot|boot.*vendor|vendorboot|vendor_boot|vendor-boot" | sort | uniq
        echo ""
        
        echo "========== 5. MKA COMMAND ANALYSIS =========="
        echo "mka is an alias for:"
        type mka || true
        echo ""
        echo "Finding mka definition:"
        grep -r "mka()" vendor/twrp/build/ build/make/ || true
        grep -r "function mka" vendor/twrp/build/ build/make/ || true
        echo ""
        
        echo "========== 6. NINJA BUILD FILES =========="
        echo "Checking for ninja build files:"
        find out -name "*.ninja" 2>/dev/null | head -20 || true
        echo ""
        
        echo "========== 7. VENDOR_BOOT BUILD SCRIPTS =========="
        echo "Looking for vendor_boot build scripts:"
        find build/make -name "*vendor*boot*" 2>/dev/null || true
        find vendor/twrp/build -name "*vendor*boot*" 2>/dev/null || true
        find bootable/recovery -name "*vendor*boot*" 2>/dev/null || true
        echo ""
        
        echo "========== 8. BUILD CACHE STATUS =========="
        echo "Current build cache:"
        ls -la out/target/product/$DEVICE/ 2>/dev/null || echo "No build yet"
        echo ""
        
        echo "========== 9. LUNCH MENU =========="
        echo "Available lunch combos:"
        lunch | grep -i $DEVICE || true
        echo ""
        
        echo "========== 10. PRODUCT CONFIGURATION =========="
        echo "Product makefile:"
        cat device/zyb/$DEVICE/AndroidProducts.mk || true
        echo ""
        echo "Product configuration:"
        cat device/zyb/$DEVICE/twrp_$DEVICE.mk | grep -E "PRODUCT_NAME|PRODUCT_DEVICE|TW_BUILD_VENDOR_BOOT" || true
        echo ""
        
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
    - name: Building recovery
      run: |
    
    
        cd ${{ steps.pwd.outputs.workspace-folder }}
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
    
        DEVICE="${{ github.event.inputs.device_name }}"
    
        breakfast "twrp_${DEVICE}-eng"
        echo "=== Setting up build environment ==="
        CURRENT_PRODUCT=$(get_build_var TARGET_PRODUCT)
        if [ "$CURRENT_PRODUCT" != "twrp_${DEVICE}" ]; then
          echo "❌ breakfast failed! Current product: $CURRENT_PRODUCT"
          echo "Expected: twrp_${DEVICE}"
          exit 1
        fi
        echo "✅ breakfast successful: $CURRENT_PRODUCT"
        echo "=== Step 2: Building vendor_boot.img ==="
        echo "This will generate the modular recovery ramdisk for header v4"
        mka vendorbootimage -j$(nproc --all)
        echo "=== Build Results ==="
        ls -la out/target/product/$DEVICE/
        if [ -f "out/target/product/$DEVICE/vendor_boot.img" ]; then
          echo "✅ vendor_boot.img generated successfully"
          echo "📦 boot.img: $(du -h out/target/product/$DEVICE/boot.img | cut -f1)"
          echo "📦 vendor_boot.img: $(du -h out/target/product/$DEVICE/vendor_boot.img | cut -f1)"
      
          echo "=== Step 3: Extracting recovery.cpio.gz ==="
          cd out/target/product/$DEVICE/
      
          if [ -f "vendor_boot.img" ] && [ -f "ramdisk.img" ]; then
            gzip -9 -c ramdisk.img > recovery.cpio.gz
            echo "✅ recovery.cpio.gz generated"
            echo "📦 recovery.cpio.gz: $(du -h recovery.cpio.gz | cut -f1)"
          fi
      
          cd ${{ steps.pwd.outputs.workspace-folder }}
        else
          echo "❌ Build failed - vendor_boot.img not found"
          echo "Checking for error logs..."
          find out/error_logs -type f -name "*.log" 2>/dev/null | head -5 | xargs cat 2>/dev/null || true
      
          echo "=== Debug Information ==="
          echo "Checking if vendor_boot target exists:"
          make help | grep -i vendor_boot || true
          echo ""
          echo "Checking BOARD_VENDOR_BOOT setting:"
          get_build_var BOARD_VENDOR_BOOT || true
      
          exit 1
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
    - name: Upload recovery artifacts
      uses: actions/upload-artifact@v4
      with:
        name: twrp-recovery-${{ github.event.inputs.device_name }}-header-v4
        path: |
          out/target/product/${{ github.event.inputs.device_name }}/boot.img
          out/target/product/${{ github.event.inputs.device_name }}/vendor_boot.img
          out/target/product/${{ github.event.inputs.device_name }}/recovery.cpio.gz
          out/target/product/${{ github.event.inputs.device_name }}/ramdisk.img
        retention-days: 7

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/out/error_logs/
          ${{ steps.pwd.outputs.workspace-folder }}/out/build-twrp_*.ninja
          out/target/product/${{ github.event.inputs.device_name }}/boot.img
          out/target/product/${{ github.event.inputs.device_name }}/vendor_boot.img
          out/target/product/${{ github.event.inputs.device_name }}/recovery.cpio.gz
        name: TWRP-${{ github.event.inputs.device_name }}-boot-header-v4-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          # TWRP Recovery for Boot Header v4 Devices
          
          **Device:** ${{ github.event.inputs.device_name }}
          **Build Type:** Modular Vendor Boot
          **Header Version:** v4
          **Ramdisk Compression:** gzip
          
          ## 📦 Included Files
          - `boot.img` - TWRP boot image
          - `vendor_boot.img` - Complete vendor_boot partition
          - `recovery.cpio.gz` - Modular recovery ramdisk only
          ## 🔧 Build Information
          - Manifest: ${{ github.event.inputs.MANIFEST_URL }}
          - Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}
          - Device Tree: ${{ github.event.inputs.DEVICE_TREE_URL }}
          - Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          ## ⚠️ Notes
          - This device uses boot header v4 with modular ramdisk support
          - Method 2 preserves stock vendor_boot vendor_ramdisk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
