name: TWRP Build for tb8786p1_64_k510_wifi
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check Env
        run: |
          echo "========================================"
          echo "📌 ENV INFO - $(date)"
          echo "========================================"
          cat /etc/os-release
          uname -a
          lscpu | grep -E "Model name|CPU\(s\)"
          free -h
          df -h --total | grep -E "Filesystem|total"
          echo "GCC: $(gcc --version | head -1)"
          echo "Python3: $(python3 --version)"
          echo "Java: $(java --version 2>&1 | head -1)"
          echo "Ninja: $(ninja --version)"
          echo "========================================"

      - name: 深度清理磁盘（释放最大空间）
        run: |
          echo "========================================"
          df -h
          echo "----------------------------------------"
          # 1. 删除系统冗余包
          sudo apt purge -y --auto-remove dotnet* mono* llvm* android* ghc* powershell*
          # 2. 清理缓存和日志
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda /usr/local/lib/node_modules /usr/local/games /usr/games
          sudo docker system prune -a -f --volumes
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/* /var/log/* /tmp/* ~/.cache/* /var/cache/*
          # 3. 清理临时文件
          sudo rm -rf /mnt/* /media/* /srv/*
          sudo swapoff -a && sudo swapon -a
          # 4. 验证空间
          echo "----------------------------------------"
          df -h
          TOTAL_AVAIL=$(df -h --total | grep "total" | awk '{print $4}' | sed 's/G//')
          if (( $(echo "$TOTAL_AVAIL < 40" | bc -l) )); then
            echo "❌ 可用空间不足40GB，当前仅${TOTAL_AVAIL}GB"
            exit 1
          fi
          echo "✅ 可用空间充足（${TOTAL_AVAIL}GB ≥ 40GB）"
          echo "========================================"

      - name: Install Dependencies（仅安装必需依赖）
        run: |
          echo "========================================"
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo apt update -y
          # 仅保留编译必需依赖，移除冗余依赖
          sudo apt install -y git python3 openjdk-11-jdk-headless gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev liblz4-tool lzop make repo ninja-build
          sudo apt clean
          git --version
          python3 --version
          java --version
          ninja --version
          echo "========================================"

      - name: Sync Source（浅克隆+仅同步必需代码）
        run: |
          echo "========================================"
          sudo mkdir -p /mnt/twrp
          sudo chown -R runner:runner /mnt/twrp
          cd /mnt/twrp
          # 浅克隆TWRP源码（仅拉取最新提交，不下载历史）
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1 --no-repo-verify 2>&1 | grep -v -E "new version of repo|launcher is not writable"
          # 同步时禁用冗余模块，仅保留核心模块
          repo sync -j$(nproc --all) --no-clone-bundle --optimized-fetch --no-tags --current-branch 2>&1 | grep -v -E "new version of repo|launcher is not writable"
          # 浅克隆设备树
          git clone --depth=1 https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi device/zyb/tb8786p1_64_k510_wifi
          # 删除冲突文件
          if [ -f "device/zyb/tb8786p1_64_k510_wifi/Android.mk" ]; then
            rm -f "device/zyb/tb8786p1_64_k510_wifi/Android.mk"
          fi
          # 生成splash.xml解决警告
          mkdir -p device/zyb/tb8786p1_64_k510_wifi/twres
          echo '<?xml version="1.0" encoding="UTF-8"?>' > device/zyb/tb8786p1_64_k510_wifi/twres/splash.xml
          echo '<splash />' >> device/zyb/tb8786p1_64_k510_wifi/twres/splash.xml
          # 验证核心文件
          REQUIRED_FILES=(
            "device/zyb/tb8786p1_64_k510_wifi/AndroidProducts.mk"
            "device/zyb/tb8786p1_64_k510_wifi/omni_tb8786p1_64_k510_wifi.mk"
            "device/zyb/tb8786p1_64_k510_wifi/BoardConfig.mk"
            "device/zyb/tb8786p1_64_k510_wifi/recovery.fstab"
            "device/zyb/tb8786p1_64_k510_wifi/twrp.mk"
            "device/zyb/tb8786p1_64_k510_wifi/dynamic_partitions_opts.xml"
            "device/zyb/tb8786p1_64_k510_wifi/dtb/mt6768.dtb"
            "device/zyb/tb8786p1_64_k510_wifi/prebuilt/Image.gz-dtb"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
              FILE_SIZE=$(du -k "$file" | awk '{print $1}')
              if [ $FILE_SIZE -lt 1 ]; then
                echo "⚠️ $file is empty"
                exit 1
              fi
            else
              echo "❌ $file missing"
              exit 1
            fi
          done
          echo "========================================"

      - name: Build vendor_boot.img（最小化编译+缓存优化）
        run: |
          echo "========================================"
          echo "🔨 BUILD START - $(date)"
          cd /mnt/twrp
          # 环境变量（限制缓存大小+最小化编译）
          export ALLOW_MISSING_DEPENDENCIES=true
          export ANDROID_JACK_VM_ARGS="-Xmx4g"  # 限制JVM内存，减少磁盘占用
          export LC_ALL=C
          export TARGET_PRODUCT=omni_tb8786p1_64_k510_wifi
          export TARGET_DEVICE=tb8786p1_64_k510_wifi
          export NUM_JOBS=4  # 降低线程数，减少临时文件占用
          # 清理旧产物（仅保留必需目录）
          rm -rf out/target/product/tb8786p1_64_k510_wifi
          rm -rf out/combined-*.ninja out/build-*.ninja
          # 加载环境
          source build/envsetup.sh
          lunch omni_tb8786p1_64_k510_wifi-eng 2>&1 | tee -a lunch.log
          # 验证加载
          if grep -q "TARGET_PRODUCT=omni_tb8786p1_64_k510_wifi" lunch.log && grep -q "TARGET_ARCH=arm64" lunch.log; then
            echo "✅ lunch success"
          else
            echo "❌ lunch failed"
            cat lunch.log
            exit 1
          fi
          # 仅编译vendorbootimage，禁用其他镜像编译
          mka vendorbootimage -j$NUM_JOBS 2>&1 | tee -a build.log
          echo "----------------------------------------"
          echo "✅ BUILD END - $(date)"
          # 验证产物
          OUT_DIR="out/target/product/tb8786p1_64_k510_wifi"
          if [ -d "$OUT_DIR" ]; then
            ls -lh $OUT_DIR/
            if [ -f "$OUT_DIR/vendor_boot.img" ]; then
              echo "🎉 Build success! vendor_boot.img generated"
              ls -lh $OUT_DIR/vendor_boot.img
              IMG_SIZE=$(du -m "$OUT_DIR/vendor_boot.img" | awk '{print $1}')
              if [ $IMG_SIZE -le 64 ]; then
                echo "✅ Image size OK (${IMG_SIZE}MB ≤ 64MB)"
              else
                echo "⚠️ Image size too big (${IMG_SIZE}MB > 64MB)"
              fi
            else
              echo "⚠️ vendor_boot.img not found"
              grep -E "error|failed|fatal|vendorbootimage" build.log
              tail -300 build.log
              exit 1
            fi
          else
            echo "❌ Out dir missing"
            tail -300 build.log
            exit 1
          fi
          echo "========================================"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tb8786p1_64_k510_wifi-vendorboot
          path: |
            /mnt/twrp/out/target/product/tb8786p1_64_k510_wifi/vendor_boot.img
            /mnt/twrp/build.log
            /mnt/twrp/lunch.log
          retention-days: 7
