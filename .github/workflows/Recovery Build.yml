name: TWRP Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/zyb/tb8786p1_64_k510_wifi'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'tb8786p1_64_k510_wifi'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'omni_tb8786p1_64_k510_wifi'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendor_boot'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Quick Disk Clean
        run: |
          sudo rm -rf /home/runner/actions-runner/cached/_diag/*
          sudo rm -rf /tmp/* /var/tmp/*
          df -h /

      - name: Create Small Swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Mount Build Dir
        run: |
          sudo mkdir -p /mnt/build
          sudo chown runner:runner /mnt/build
          ln -sf /mnt/build $HOME/workspace
          df -h /mnt

      - name: Install Deps
        run: |
          sudo apt update -y -qq
          DEBIAN_FRONTEND=noninteractive sudo apt install -y -qq gperf gcc-multilib g++-multilib libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://mirrors.tuna.tsinghua.edu.cn/git/git-repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global http.postBuffer 1073741824

      - name: Init Repo
        run: |
          cd /mnt/build
          git config --global user.name "B"
          git config --global user.email "b@b.com"
          repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --no-repo-verify

      - name: Sync Source
        run: |
          cd /mnt/build
          repo sync -j16 --force-sync --no-clone-bundle --quiet

      - name: Clone Device Tree
        run: |
          mkdir -p /mnt/build/${{ github.event.inputs.DEVICE_PATH }}
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} /mnt/build/${{ github.event.inputs.DEVICE_PATH }} --depth=1

      - name: Build
        run: |
          cd /mnt/build
          export ALLOW_MISSING_DEPENDENCIES=true USE_CCACHE=1 ANDROID_BUILD_SANDBOXING=0
          ccache -M 50G
          source build/envsetup.sh
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
          make -j8 ${{ github.event.inputs.BUILD_TARGET }}image

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: /mnt/build/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
