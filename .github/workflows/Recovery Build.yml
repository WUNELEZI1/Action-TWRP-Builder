name: TWRP Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/zyb/tb8786p1_64_k510_wifi'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'tb8786p1_64_k510_wifi'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'omni_tb8786p1_64_k510_wifi'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendor_boot'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Maximize System Resources
        run: |
          # 快速创建64G交换分区（跳过不存在文件的swapoff）
          [ -f /swapfile ] && sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 64G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "/swapfile swap swap defaults 0 0" | sudo tee -a /etc/fstab
          
          # 深度清理系统冗余文件（跳过不存在的包）
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null
          sudo apt remove -y --purge linux-headers-* linux-image-* snapd docker* 2>/dev/null
          sudo apt autoremove -y -qq 2>/dev/null
          sudo apt clean -qq 2>/dev/null
          sudo rm -rf /var/cache/apt/* /var/lib/apt/lists/* /tmp/* /var/tmp/* 2>/dev/null
          
          # 挂载大磁盘到编译目录
          sudo mkdir -p /mnt/build
          sudo chown -R runner:runner /mnt/build
          ln -sf /mnt/build $HOME/workspace
          
          # 优化系统参数
          sudo sysctl -w vm.swappiness=10
          sudo sysctl -w vm.dirty_ratio=50
          sudo sysctl -w vm.dirty_background_ratio=10
          df -h
          free -h

      - name: Install Dependencies
        run: |
          sudo apt update -y -qq
          DEBIAN_FRONTEND=noninteractive sudo apt install -y -qq \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: 'gradle'

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -fsSL --max-time 30 https://mirrors.tuna.tsinghua.edu.cn/git/git-repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global http.postBuffer 2147483648
          git config --global core.compression 0
          git config --global pack.threads 16
          git config --global pack.windowMemory "16g"

      - name: Initialize Repo
        run: |
          cd /mnt/build
          git config --global user.name "Builder"
          git config --global user.email "builder@github.com"
          repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --no-repo-verify --quiet
          echo "workspace-folder=/mnt/build" >> $GITHUB_OUTPUT
        id: pwd

      - name: Sync Source Code (Max Speed)
        run: |
          cd /mnt/build
          repo sync -j64 --fail-fast --force-sync --no-clone-bundle --optimized-fetch --no-tags --current-branch --quiet
          df -h

      - name: Clone Device Tree
        run: |
          mkdir -p /mnt/build/${{ github.event.inputs.DEVICE_PATH }}
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} /mnt/build/${{ github.event.inputs.DEVICE_PATH }} --depth=1 --quiet

      - name: Fix Build Configuration
        run: |
          cd /mnt/build
          sed -i 's/PRODUCT_PROPERTY_OVERRIDES +=/PRODUCT_SYSTEM_DEFAULT_PROPERTIES +=/g' vendor/twrp/config/common.mk
          sed -i 's/PRODUCT_PROPERTY_OVERRIDES =/PRODUCT_SYSTEM_DEFAULT_PROPERTIES =/g' vendor/twrp/config/common.mk
          [ -f "${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk" ] && {
            sed -i 's/BOARD_PLAT_PUBLIC_SEPOLICY_DIR/SYSTEM_EXT_PUBLIC_SEPOLICY_DIRS/g' ${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk
            sed -i 's/BOARD_PLAT_PRIVATE_SEPOLICY_DIR/SYSTEM_EXT_PRIVATE_SEPOLICY_DIRS/g' ${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk
          }

      - name: Build TWRP (Ultimate Performance)
        run: |
          cd /mnt/build
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=9
          export ANDROID_BUILD_SANDBOXING=0
          export TMPDIR=/mnt/build/tmp
          export CCACHE_DIR=/mnt/build/ccache
          mkdir -p $TMPDIR $CCACHE_DIR
          
          # 200G CCACHE缓存，极速编译
          ccache -M 200G
          ccache -z
          ccache -o compression=true
          
          # 加载编译环境并极速编译
          source build/envsetup.sh
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng -q
          make -j$(nproc --all) ${{ github.event.inputs.BUILD_TARGET }}image -k 2>&1 | tee build.log

      - name: Upload Build Result
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: /mnt/build/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          body: "TWRP Build for ${{ github.event.inputs.DEVICE_NAME }} (Ultimate Speed)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
