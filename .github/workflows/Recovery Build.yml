name: TWRP Build for tb8786p1_64_k510_wifi (Vendor Boot Ramdisk)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/zyb/tb8786p1_64_k510_wifi

    - name: Check Environment
      run: |
        echo "========================================"
        echo "📌 ENVIRONMENT INFO - $(date)"
        echo "========================================"
        cat /etc/os-release
        uname -a
        lscpu | grep -E "Model name|CPU\(s\)"
        free -h
        df -h --total | grep -E "Filesystem|total"
        echo "GCC: $(gcc --version | head -1)"
        echo "Python3: $(python3 --version)"
        echo "Java: $(java --version 2>&1 | head -1)"
        echo "Ninja: $(ninja --version)"
        echo "========================================"

    - name: Install Build Dependencies
      run: |
        echo "========================================"
        echo "🔧 Installing build dependencies..."
        sudo apt update -y
        sudo apt install -y bc git-core python3 openjdk-11-jdk-headless \
          gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev \
          liblz4-tool lzop make repo ninja-build curl unzip \
          libssl-dev libxml2-utils xsltproc zip \
          libncurses5 libncursesw5 libc6-dev-i386 \
          dos2unix rsync imagemagick
        sudo apt clean
        echo "✅ Dependencies installed"
        echo "========================================"

    - name: Setup Build Environment
      run: |
        echo "========================================"
        echo "🔧 Setting up build environment..."
        mkdir -p ~/twrp-build
        cd ~/twrp-build
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export TW_DEVICE_VERSION=3.7.0-zyb
        
        echo "✅ Environment setup completed"
        echo "========================================"

    - name: Sync TWRP Source + Configure Device Tree
      run: |
        echo "========================================"
        echo "📥 Syncing TWRP source + configuring device tree..."
        cd ~/twrp-build
        
        # 初始化源码
        repo init --depth=1 \
          -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp \
          -b twrp-12.1 \
          --no-repo-verify
        
        # 复制你的设备树到正确路径
        mkdir -p device/zyb
        cp -r $GITHUB_WORKSPACE/device/zyb/tb8786p1_64_k510_wifi device/zyb/
        
        # 生成roomservice.xml（避免heredoc的YAML解析问题）
        mkdir -p .repo/local_manifests
        echo '<?xml version="1.0" encoding="UTF-8"?>' > .repo/local_manifests/roomservice.xml
        echo '<manifest>' >> .repo/local_manifests/roomservice.xml
        echo '  <remote name="github" fetch="https://github.com/" />' >> .repo/local_manifests/roomservice.xml
        echo '  <project path="device/zyb/tb8786p1_64_k510_wifi"' >> .repo/local_manifests/roomservice.xml
        echo '           name="WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi"' >> .repo/local_manifests/roomservice.xml
        echo '           remote="github"' >> .repo/local_manifests/roomservice.xml
        echo '           revision="main"' >> .repo/local_manifests/roomservice.xml
        echo '           groups="device" />' >> .repo/local_manifests/roomservice.xml
        echo '</manifest>' >> .repo/local_manifests/roomservice.xml
        
        # 同步源码
        repo sync -j$(nproc --all) \
          --no-clone-bundle \
          --no-tags \
          --optimized-fetch \
          --current-branch \
          --force-sync \
          -c \
          --prune
        
        echo "✅ Source sync + device tree configuration completed"
        echo "========================================"

    - name: Prepare Build Configuration
      run: |
        echo "========================================"
        echo "⚙️ Preparing build configuration..."
        cd ~/twrp-build
        
        source build/envsetup.sh
        export TARGET_DEVICE=tb8786p1_64_k510_wifi
        export TARGET_PRODUCT=omni_tb8786p1_64_k510_wifi
        
        # 执行lunch
        lunch omni_tb8786p1_64_k510_wifi-eng 2>&1 | tee lunch.log
        
        # 验证设备树识别
        if grep -q "TARGET_PRODUCT=omni_tb8786p1_64_k510_wifi" lunch.log; then
          echo "✅ Device tree recognized successfully"
        else
          echo "❌ Device tree not found! Checking path..."
          ls -la device/zyb/
          exit 1
        fi
        
        echo "📊 Build variables:"
        echo "TARGET_PRODUCT: $TARGET_PRODUCT"
        echo "TARGET_DEVICE: $TARGET_DEVICE"
        echo "========================================"

    - name: Build Vendor Boot Recovery Ramdisk
      run: |
        echo "========================================"
        echo "🔨 BUILDING VENDOR_BOOT RECOVERY RAMDISK - $(date)"
        echo "========================================"
        
        cd ~/twrp-build
        source build/envsetup.sh
        lunch omni_tb8786p1_64_k510_wifi-eng
        
        # 使用m命令构建recoveryimage（适配Android 12.1）
        m recoveryimage -j$(nproc) 2>&1 | tee build.log
        
        BUILD_STATUS=${PIPESTATUS[0]}
        if [ $BUILD_STATUS -ne 0 ]; then
          echo "❌ Build failed! Showing error details:"
          grep -i -E "error:|failed:|fatal:|No rule to make target|Stop" build.log | head -20
          tail -50 build.log
          exit 1
        fi
        
        echo "✅ Build successful at $(date)"
        echo "========================================"

    - name: Collect Ramdisk Artifacts
      run: |
        echo "========================================"
        echo "📦 Collecting ramdisk artifacts..."
        cd ~/twrp-build
        OUT_DIR="out/target/product/tb8786p1_64_k510_wifi"
        mkdir -p artifacts
        
        # 收集所有ramdisk相关文件（适配vendor_boot:recovery）
        find $OUT_DIR -name "*.cpio*" -type f 2>/dev/null | while read file; do
          echo "🎯 Found ramdisk file: $file"
          cp "$file" artifacts/
        done
        
        # 收集日志
        cp build.log artifacts/
        cp lunch.log artifacts/
        
        echo "📊 Collected artifacts:"
        ls -lh artifacts/
        echo "========================================"

    - name: Upload Ramdisk Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: twrp-vendor-boot-ramdisk
        path: ~/twrp-build/artifacts/*
        retention-days: 30

    - name: Build Summary
      if: always()
      run: |
        echo "========================================"
        echo "📊 BUILD SUMMARY - $(date)"
        echo "========================================"
        echo "Status: ${{ job.status }}"
        echo "Device: tb8786p1_64_k510_wifi (ZYB ZPD1321)"
        echo "Target: vendor_boot:recovery"
        echo "Flash command:"
        echo "fastboot flash vendor_boot:recovery <ramdisk-file>.cpio.gz"
