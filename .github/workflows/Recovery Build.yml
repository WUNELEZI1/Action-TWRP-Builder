name: TWRP Build for tb8786p1_64_k510_wifi
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 深度清理磁盘空间（保留ccache依赖）
        run: |
          # 清理超大冗余包（释放10GB+空间）
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /var/lib/apt/lists/*
          # 清理docker镜像（释放5GB+空间）
          sudo docker system prune -a -f
          # 清理日志和缓存（不删除ccache相关）
          sudo rm -rf /var/log/* /tmp/* ~/.cache/*
          # 检查剩余空间
          df -h

      - name: 安装依赖（明确安装并保留ccache）
        run: |
          # 更新源并明确安装ccache，避免被autoremove删除
          sudo apt update && sudo apt install -y --no-install-recommends \
            git ccache python3 openjdk-11-jdk-headless \
            gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev \
            liblz4-tool imagemagick lzop
          # 关键：标记ccache为手动安装（防止被autoremove删除）
          sudo apt-mark manual ccache
          # 仅清理无用包，不删除手动标记的ccache
          sudo apt clean

      - name: 配置repo工具
        run: |
          mkdir -p ~/bin
          curl -fsSL https://mirrors.tuna.tsinghua.edu.cn/git/git-repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH="$HOME/bin:$PATH"

      - name: 同步源码并修复核心语法错误
        run: |
          export PATH="$HOME/bin:$PATH"
          
          # 创建编译目录
          mkdir -p $HOME/twrp
          cd $HOME/twrp
          
          # 极致精简源码同步（仅同步必需部分）
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1
          repo sync -j2 --no-clone-bundle --optimized-fetch --no-tags
          
          # 克隆设备树（深度1，减少体积）
          git clone --depth=1 https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi device/zyb/tb8786p1_64_k510_wifi
          
          # 修复语法错误
          sed -i '/export PRODUCT_PROPERTY_OVERRIDES/d' vendor/twrp/config/common.mk
          sed -i 's/^PRODUCT_PROPERTY_OVERRIDES :=/PRODUCT_PROPERTY_OVERRIDES +=/g' vendor/twrp/config/common.mk
          sed -i 's/^PRODUCT_PROPERTY_OVERRIDES :=/PRODUCT_PROPERTY_OVERRIDES +=/g' device/zyb/tb8786p1_64_k510_wifi/*.mk
          
          # 再次清理临时文件
          rm -rf .repo/.repo_cache ~/.repo/cache

      - name: 编译TWRP镜像（低并发+小缓存）
        run: |
          cd $HOME/twrp
          
          # 验证ccache是否存在
          which ccache && ccache --version
          
          # 配置ccache（5G缓存，节省空间）
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export ALLOW_MISSING_DEPENDENCIES=true
          ccache -M 5G
          
          # 加载环境
          source build/envsetup.sh
          lunch omni_tb8786p1_64_k510_wifi-eng
          
          # 低并发编译（减少内存/磁盘压力）
          make -j4 vendor_bootimage bootimage 2>&1 | tee build.log

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: tb8786p1_64_k510_wifi-twrp
          path: |
            $HOME/twrp/out/target/product/tb8786p1_64_k510_wifi/*.img
            $HOME/twrp/build.log
          retention-days: 7
