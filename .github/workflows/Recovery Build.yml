name: TWRP Build for tb8786p1_64_k510_wifi (Vendor Boot Ramdisk)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check Env
        run: |
          echo "========================================"
          echo "📌 ENV INFO - $(date)"
          echo "========================================"
          cat /etc/os-release
          uname -a
          lscpu | grep -E "Model name|CPU\(s\)"
          free -h
          df -h --total | grep -E "Filesystem|total"
          echo "GCC: $(gcc --version | head -1)"
          echo "Python3: $(python3 --version)"
          echo "Java: $(java --version 2>&1 | head -1)"
          echo "Ninja: $(ninja --version)"
          echo "========================================"

      - name: 安装编译依赖
        run: |
          echo "========================================"
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo apt update -y
          sudo apt install -y bc git python3 openjdk-11-jdk-headless gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev liblz4-tool lzop make repo ninja-build
          sudo apt clean
          echo "========================================"

      - name: 同步源码
        run: |
          echo "========================================"
          sudo mkdir -p /mnt/twrp
          sudo chown -R runner:runner /mnt/twrp
          cd /mnt/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1 --no-repo-verify
          repo sync -j$(nproc --all) --no-clone-bundle --optimized-fetch --no-tags --current-branch
          # 关键：克隆你的设备树，但这次不删除Android.mk
          git clone --depth=1 https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi device/zyb/tb8786p1_64_k510_wifi
          echo "========================================"

      - name: 构建 TWRP Recovery Ramdisk
        run: |
          echo "========================================"
          echo "🔨 BUILD START - $(date)"
          cd /mnt/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export NUM_JOBS=4
          
          # 设置构建环境
          source build/envsetup.sh
          # 使用你在AndroidProducts.mk中定义的选择
          lunch omni_tb8786p1_64_k510_wifi-eng 2>&1 | tee lunch.log
          if ! grep -q "TARGET_PRODUCT=omni_tb8786p1_64_k510_wifi" lunch.log; then
            echo "❌ lunch failed"
            cat lunch.log
            exit 1
          fi
          echo "✅ lunch success"
          
          # 核心：构建 recoveryimage。在TW_NO_BUILD_RECOVERY_IMAGE=true时，
          # 这通常会触发生成TWRP recovery ramdisk（如ramdisk-recovery.cpio.gz）
          # 而不是完整的recovery.img。
          echo "Building recoveryimage (to generate ramdisk)..."
          mka recoveryimage -j$NUM_JOBS 2>&1 | tee build.log
          
          echo "----------------------------------------"
          echo "✅ BUILD END - $(date)"
          
          # 查找并验证生成的ramdisk文件
          OUT_DIR="out/target/product/tb8786p1_64_k510_wifi"
          echo "Searching for ramdisk in $OUT_DIR ..."
          find "$OUT_DIR" -name "*.cpio*" -type f 2>/dev/null | while read f; do echo "Found: $f"; done
          
          # 预期的主要产物：压缩的recovery ramdisk
          EXPECTED_RAMDISK="$OUT_DIR/ramdisk-recovery.cpio.gz"
          if [ -f "$EXPECTED_RAMDISK" ]; then
            echo "🎉 SUCCESS: TWRP recovery ramdisk generated!"
            ls -lh "$EXPECTED_RAMDISK"
            echo ""
            echo "下一步操作:"
            echo "1. 下载构建产物中的 '$OUT_DIR/ramdisk-recovery.cpio.gz'"
            echo "2. 重命名为 'recovery.cpio.gz' (可选)"
            echo "3. 将设备重启至fastboot模式"
            echo "4. 刷入命令: fastboot flash vendor_boot:recovery recovery.cpio.gz"
            echo "5. 重启: fastboot reboot"
          else
            echo "⚠️ 预期产物未找到。检查可能的构建输出..."
            # 检查其他可能的位置
            if [ -f "$OUT_DIR/recovery/root.cpio.gz" ]; then
              echo "Found alternative: $OUT_DIR/recovery/root.cpio.gz"
              cp "$OUT_DIR/recovery/root.cpio.gz" "$OUT_DIR/ramdisk-recovery.cpio.gz"
              echo "✅ Copied to $OUT_DIR/ramdisk-recovery.cpio.gz"
            else
              echo "❌ 构建可能未生成正确的ramdisk。检查日志中的错误。"
              echo "=== 构建日志节选 (错误) ==="
              grep -E "error:|failed:|fatal:|No rule to make target" build.log | head -30
              exit 1
            fi
          fi
          echo "========================================"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: twrp-vendor_boot-ramdisk
          path: |
            /mnt/twrp/out/target/product/tb8786p1_64_k510_wifi/ramdisk-recovery.cpio.gz
            /mnt/twrp/out/target/product/tb8786p1_64_k510_wifi/*.dtb
            /mnt/twrp/build.log
            /mnt/twrp/lunch.log
          retention-days: 7
