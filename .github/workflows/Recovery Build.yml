name: TWRP Build for tb8786p1_64_k510_wifi (Vendor Boot Ramdisk)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/zyb/tb8786p1_64_k510_wifi

    - name: 深度清理磁盘（修复空间判断逻辑）
      run: |
        echo "========================================"
        echo "🗑️ Deep cleaning disk space..."
        df -h
        echo "----------------------------------------"
        # 删除系统冗余包和缓存
        sudo apt purge -y --auto-remove -qq \
          dotnet* mono* llvm* android* ghc* powershell* \
          libreoffice* thunderbird* firefox* chrome* \
          docker* lxd* snapd*
        sudo rm -rf /var/lib/apt/lists/* /var/log/* /tmp/* ~/.cache/* /var/cache/*
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
        sudo rm -rf /usr/share/miniconda /usr/local/lib/node_modules /usr/local/games /usr/games
        sudo swapoff -a && sudo swapon -a
        sudo rm -rf /media/* /srv/* /mnt/* 2>/dev/null || true
        # 修复逻辑：判断可用空间≥40GB才继续（之前写反了）
        echo "----------------------------------------"
        df -h
        TOTAL_AVAIL=$(df -h --total | grep "total" | awk '{print $4}' | sed 's/G//')
        if ! echo "$TOTAL_AVAIL >= 40" | awk '{exit !($1 >= $2)}'; then
          echo "❌ 可用空间不足40GB，当前仅${TOTAL_AVAIL}GB"
          exit 1
        fi
        echo "✅ 可用空间充足（${TOTAL_AVAIL}GB ≥ 40GB）"
        echo "========================================"

    - name: Install Full Build Dependencies
      run: |
        echo "========================================"
        echo "🔧 Installing full dependencies..."
        sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
        sudo apt update -y -qq
        sudo apt install -y -qq \
          git python3 openjdk-11-jdk-headless \
          gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev \
          liblz4-tool lzop make repo ninja-build curl unzip \
          dos2unix rsync bc libxml2-utils xsltproc zip \
          libncurses5 libncursesw5 libc6-dev-i386
        sudo apt clean
        echo "✅ Dependencies installed"
        echo "========================================"

    - name: Setup Build Environment
      run: |
        echo "========================================"
        echo "🔧 Setting up build environment..."
        mkdir -p ~/twrp-build
        cd ~/twrp-build
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export TW_DEVICE_VERSION=3.7.0-zyb
        
        echo "✅ Environment setup completed"
        echo "========================================"

    - name: Sync Full TWRP Source + 设备树
      run: |
        echo "========================================"
        echo "📥 Syncing full TWRP source + device tree..."
        cd ~/twrp-build
        
        # 初始化完整TWRP源码
        repo init --depth=1 \
          -u https://github.com/TeamWin/platform_manifest_twrp_aosp \
          -b twrp-12.1 \
          --no-repo-verify
        
        # 复制设备树
        mkdir -p device/zyb
        cp -r $GITHUB_WORKSPACE/device/zyb/tb8786p1_64_k510_wifi device/zyb/
        
        # 生成roomservice.xml
        mkdir -p .repo/local_manifests
        echo '<?xml version="1.0" encoding="UTF-8"?>' > .repo/local_manifests/roomservice.xml
        echo '<manifest>' >> .repo/local_manifests/roomservice.xml
        echo '  <project path="device/zyb/tb8786p1_64_k510_wifi"' >> .repo/local_manifests/roomservice.xml
        echo '           name="device/zyb/tb8786p1_64_k510_wifi"' >> .repo/local_manifests/roomservice.xml
        echo '           revision="main"' >> .repo/local_manifests/roomservice.xml
        echo '           groups="device" />' >> .repo/local_manifests/roomservice.xml
        echo '  <project path="vendor/twrp" ' >> .repo/local_manifests/roomservice.xml
        echo '           name="TeamWin/android_vendor_twrp" ' >> .repo/local_manifests/roomservice.xml
        echo '           remote="github" ' >> .repo/local_manifests/roomservice.xml
        echo '           revision="twrp-12.1" />' >> .repo/local_manifests/roomservice.xml
        echo '</manifest>' >> .repo/local_manifests/roomservice.xml
        
        # 同步源码
        repo sync -j$(nproc --all) \
          --no-clone-bundle \
          --no-tags \
          --optimized-fetch \
          --current-branch \
          -c \
          --prune
        
        echo "✅ Full source + device tree sync completed"
        echo "========================================"

    - name: Prepare Build Configuration
      run: |
        echo "========================================"
        echo "⚙️ Preparing build configuration..."
        cd ~/twrp-build
        
        source build/envsetup.sh
        export TARGET_DEVICE=tb8786p1_64_k510_wifi
        export TARGET_PRODUCT=omni_tb8786p1_64_k510_wifi
        
        lunch omni_tb8786p1_64_k510_wifi-eng 2>&1 | tee lunch.log
        
        if grep -q "TARGET_PRODUCT=omni_tb8786p1_64_k510_wifi" lunch.log; then
          echo "✅ Device tree recognized successfully"
        else
          echo "❌ Device tree not found!"
          ls -la device/zyb/
          exit 1
        fi
        
        if [ -f "vendor/twrp/build/envsetup.sh" ]; then
          echo "✅ TWRP vendor dependencies found"
        else
          echo "❌ TWRP vendor dependencies missing!"
          exit 1
        fi
        
        echo "📊 Build variables: TARGET_PRODUCT=$TARGET_PRODUCT, TARGET_DEVICE=$TARGET_DEVICE"
        echo "========================================"

    - name: Build Vendor Boot Recovery Ramdisk
      run: |
        echo "========================================"
        echo "🔨 BUILDING VENDOR_BOOT RECOVERY RAMDISK - $(date)"
        echo "========================================"
        
        cd ~/twrp-build
        source build/envsetup.sh
        lunch omni_tb8786p1_64_k510_wifi-eng
        
        m recoveryimage -j4 2>&1 | tee build.log
        
        BUILD_STATUS=${PIPESTATUS[0]}
        if [ $BUILD_STATUS -ne 0 ]; then
          echo "❌ Build failed! Error details:"
          grep -i -E "error:|failed:|fatal:" build.log | head -30
          tail -100 build.log
          exit 1
        fi
        
        echo "✅ Build successful!"
        echo "========================================"

    - name: Collect Artifacts
      run: |
        echo "========================================"
        echo "📦 Collecting artifacts..."
        cd ~/twrp-build
        OUT_DIR="out/target/product/tb8786p1_64_k510_wifi"
        mkdir -p artifacts
        
        find $OUT_DIR -name "*.cpio*" -type f | while read file; do
          echo "🎯 Found ramdisk: $file"
          cp "$file" artifacts/
        done
        
        cp $OUT_DIR/recovery.img artifacts/ 2>/dev/null || true
        cp build.log artifacts/
        cp lunch.log artifacts/
        
        ls -lh artifacts/
        echo "========================================"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: twrp-vendor-boot-ramdisk
        path: ~/twrp-build/artifacts/*
        retention-days: 30

    - name: Build Summary
      if: always()
      run: |
        echo "========================================"
        echo "📊 BUILD SUMMARY - $(date)"
        echo "========================================"
        echo "Status: ${{ job.status }}"
        echo "Device: tb8786p1_64_k510_wifi (MT6768, Android 13)"
        echo "Flash command: fastboot flash vendor_boot:recovery <ramdisk-file>.cpio.gz"
