name: TWRP Build for tb8786p1_64_k510_wifi
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 初始化环境
        run: |
          # 清理空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt update && sudo apt install -y git ccache python3 openjdk-11-jdk gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev liblz4-tool imagemagick lzop
          
          # 配置repo
          mkdir -p ~/bin
          curl -fsSL https://mirrors.tuna.tsinghua.edu.cn/git/git-repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo 'export PATH="$HOME/bin:$PATH"' >> ~/.bashrc
          source ~/.bashrc

      - name: 同步源码并修复编译配置
        run: |
          export PATH="$HOME/bin:$PATH"
          
          # 创建编译目录
          mkdir -p $HOME/twrp
          cd $HOME/twrp
          
          # 初始化TWRP 12.1源码
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1
          repo sync -j$(nproc) --no-clone-bundle --optimized-fetch
          
          # 克隆设备树（替换为你的实际仓库地址）
          git clone https://github.com/你的仓库/android_device_zyb_tb8786p1_64_k510_wifi device/zyb/tb8786p1_64_k510_wifi
          
          # ========== 关键修复：移除废弃的export关键字 ==========
          # 修复vendor/twrp/config/common.mk
          sed -i '/export PRODUCT_PROPERTY_OVERRIDES/d' vendor/twrp/config/common.mk
          sed -i 's/^PRODUCT_PROPERTY_OVERRIDES :=/PRODUCT_PROPERTY_OVERRIDES +=/g' vendor/twrp/config/common.mk
          
          # 修复设备树中的PRODUCT_PROPERTY_OVERRIDES写法
          sed -i 's/^PRODUCT_PROPERTY_OVERRIDES :=/PRODUCT_PROPERTY_OVERRIDES +=/g' device/zyb/tb8786p1_64_k510_wifi/*.mk
          
          # 确保设备配置文件命名规范
          if [ -f "device/zyb/tb8786p1_64_k510_wifi/omni_tb8786p1_64_k510_wifi.mk" ]; then
              echo "设备配置文件存在"
              # 添加设备到编译列表（解决lunch识别问题）
              echo "add_lunch_combo omni_tb8786p1_64_k510_wifi-eng" >> device/zyb/tb8786p1_64_k510_wifi/AndroidProducts.mk
          fi

      - name: 编译TWRP
        run: |
          cd $HOME/twrp
          
          # 配置编译环境
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export ALLOW_MISSING_DEPENDENCIES=true
          ccache -M 20G
          
          # 加载环境并编译
          source build/envsetup.sh
          
          # 先列出可用设备确认名称
          echo "===== 可用设备列表 ====="
          lunch | grep tb8786p1 || true
          
          # 执行编译（使用正确的设备名称）
          lunch omni_tb8786p1_64_k510_wifi-eng
          make -j$(nproc) vendor_bootimage bootimage 2>&1 | tee build.log

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: tb8786p1_64_k510_wifi-twrp
          path: |
            $HOME/twrp/out/target/product/tb8786p1_64_k510_wifi/*.img
            $HOME/twrp/build.log
          retention-days: 7
