name: TWRP Build for tb8786p1_64_k510_wifi (Vendor Boot Ramdisk)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check Environment
        run: |
          echo "========================================"
          echo "📌 ENVIRONMENT INFO - $(date)"
          echo "========================================"
          cat /etc/os-release
          uname -a
          lscpu | grep -E "Model name|CPU\(s\)"
          free -h
          df -h --total | grep -E "Filesystem|total"
          echo "GCC: $(gcc --version | head -1)"
          echo "Python3: $(python3 --version)"
          echo "Java: $(java --version 2>&1 | head -1)"
          echo "Ninja: $(ninja --version)"
          echo "========================================"

      - name: Install Build Dependencies
        run: |
          echo "========================================"
          echo "🔧 Installing build dependencies..."
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo apt update -y
          sudo apt install -y bc git-core python3 openjdk-11-jdk-headless \
            gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev \
            liblz4-tool lzop make repo ninja-build curl unzip
          sudo apt clean
          echo "✅ Dependencies installed"
          echo "========================================"

      - name: Sync Source Code
        run: |
          echo "========================================"
          echo "📥 Syncing TWRP source code..."
          sudo mkdir -p /mnt/twrp
          sudo chown -R runner:runner /mnt/twrp
          cd /mnt/twrp
          
          # Initialize repo with minimal manifest
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp \
            -b twrp-12.1 \
            --no-repo-verify
          
          # Sync only essential repos
          repo sync -j$(nproc --all) \
            --no-clone-bundle \
            --optimized-fetch \
            --no-tags \
            --current-branch \
            --force-sync \
            --detach
          
          # Clone your device tree
          echo "📂 Cloning device tree..."
          git clone --depth=1 \
            https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi \
            device/zyb/tb8786p1_64_k510_wifi
            
          echo "✅ Source sync completed"
          echo "========================================"

      - name: Prepare Build Environment
        run: |
          echo "========================================"
          echo "⚙️ Preparing build environment..."
          cd /mnt/twrp
          
          # ===== 关键修复：主题文件检查与处理 =====
          echo "🔍 Checking TWRP theme files..."
          THEME_BASE="bootable/recovery/gui/theme"
          
          # 检查portrait_mdpi主题是否存在
          if [ -d "$THEME_BASE/portrait_mdpi" ]; then
            echo "✅ Found portrait_mdpi theme"
            if [ ! -f "$THEME_BASE/portrait_mdpi/ui.xml" ]; then
              echo "⚠️ ui.xml missing in portrait_mdpi, checking other themes..."
              # 查找任何包含ui.xml的主题
              find "$THEME_BASE" -name "ui.xml" | head -3
            fi
          else
            echo "❌ portrait_mdpi theme not found! Available themes:"
            ls -la "$THEME_BASE/" 2>/dev/null || echo "Theme directory doesn't exist"
            echo "⚠️ This may cause build failure"
          fi
          
          # ===== 环境变量设置 =====
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export NUM_JOBS=4
          export BUILD_NUMBER=$(date +%Y%m%d.%H%M%S)
          
          # 设置构建环境
          source build/envsetup.sh
          
          # 选择构建目标
          lunch omni_tb8786p1_64_k510_wifi-eng 2>&1 | tee lunch.log
          
          if ! grep -q "TARGET_PRODUCT=omni_tb8786p1_64_k510_wifi" lunch.log; then
            echo "❌ lunch failed!"
            echo "=== LUNCH LOG ==="
            cat lunch.log
            exit 1
          fi
          
          echo "✅ Environment prepared:"
          grep -E "TARGET_PRODUCT|TARGET_ARCH|PLATFORM_VERSION" lunch.log | head -5
          echo "========================================"

      - name: Build TWRP Vendor Boot Image
        run: |
          echo "========================================"
          echo "🔨 BUILD START - $(date)"
          echo "========================================"
          
          # ===== 构建策略 =====
          # 方案1: 先尝试构建bootimage（可能触发vendor_boot）
          echo "🔄 Strategy 1: Building bootimage..."
          make bootimage -j$NUM_JOBS 2>&1 | tee -a build_strategy1.log
          
          # 检查是否生成了vendor_boot相关文件
          OUT_DIR="out/target/product/tb8786p1_64_k510_wifi"
          if [ -f "$OUT_DIR/vendor_boot.img" ] || [ -f "$OUT_DIR/ramdisk-recovery.cpio.gz" ]; then
            echo "✅ Strategy 1 successful!"
            cp build_strategy1.log build.log
          else
            echo "⚠️ Strategy 1 didn't produce expected output"
            echo "🔄 Strategy 2: Trying vendorbootimage directly..."
            
            # 方案2: 尝试直接构建vendorbootimage
            if make help 2>/dev/null | grep -q vendorbootimage; then
              make vendorbootimage -j$NUM_JOBS 2>&1 | tee -a build_strategy2.log
              cp build_strategy2.log build.log
            else
              echo "⚠️ vendorbootimage target not available"
              echo "🔄 Strategy 3: Building recoveryimage..."
              
              # 方案3: 构建recoveryimage
              make recoveryimage -j$NUM_JOBS 2>&1 | tee -a build_strategy3.log
              cp build_strategy3.log build.log
            fi
          fi
          
          echo "----------------------------------------"
          echo "✅ BUILD END - $(date)"
          echo "========================================"

      - name: Verify and Collect Artifacts
        run: |
          echo "========================================"
          echo "📦 Verifying build artifacts..."
          echo "========================================"
          
          OUT_DIR="out/target/product/tb8786p1_64_k510_wifi"
          
          # 创建产物目录
          mkdir -p artifacts
          
          # 检查各种可能的输出文件
          echo "🔍 Looking for build artifacts..."
          
          # 1. 检查vendor_boot.img
          if [ -f "$OUT_DIR/vendor_boot.img" ]; then
            echo "🎉 FOUND: vendor_boot.img"
            ls -lh "$OUT_DIR/vendor_boot.img"
            cp "$OUT_DIR/vendor_boot.img" artifacts/
            echo "FLASH: fastboot flash vendor_boot vendor_boot.img"
          fi
          
          # 2. 检查ramdisk文件
          RAMDISK_FILES=$(find "$OUT_DIR" -name "*.cpio*" -type f 2>/dev/null)
          if [ -n "$RAMDISK_FILES" ]; then
            echo "🎉 FOUND ramdisk files:"
            echo "$RAMDISK_FILES" | while read file; do
              ls -lh "$file"
              cp "$file" artifacts/
              
              # 如果是压缩的ramdisk
              if [[ "$file" == *.cpio.gz ]]; then
                echo "FLASH: fastboot flash vendor_boot:recovery $(basename "$file")"
              fi
            done
          fi
          
          # 3. 检查其他相关文件
          for img in boot.img dtbo.img vbmeta.img; do
            if [ -f "$OUT_DIR/$img" ]; then
              echo "📄 Found: $img"
              cp "$OUT_DIR/$img" artifacts/
            fi
          done
          
          # 4. 检查dtb文件
          if [ -f "$OUT_DIR/dtb.img" ] || [ -f "$OUT_DIR/dtb" ]; then
            echo "📄 Found DTB files"
            find "$OUT_DIR" -name "*.dtb" -o -name "dtb.img" | xargs -I {} cp {} artifacts/
          fi
          
          # 5. 收集构建日志
          cp build.log artifacts/
          cp lunch.log artifacts/
          
          # 如果没有找到任何预期产物
          if [ ! -f "artifacts/vendor_boot.img" ] && [ -z "$(find artifacts -name '*.cpio*')" ]; then
            echo "❌ No expected artifacts found!"
            echo "=== BUILD LOG ERRORS ==="
            grep -E "error:|failed:|fatal:|Error |Stop" build.log | head -20
            echo "=== LAST 50 LINES OF BUILD LOG ==="
            tail -50 build.log
            exit 1
          fi
          
          echo "✅ Artifact collection completed"
          echo "📁 Artifacts directory contents:"
          ls -lh artifacts/
          echo "========================================"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-build-artifacts
          path: |
            /mnt/twrp/artifacts/*
          retention-days: 7
