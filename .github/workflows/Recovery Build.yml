name: TWRP Build for tb8786p1_64_k510_wifi
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /var/lib/apt/lists/*
          sudo docker system prune -a -f
          sudo rm -rf /var/log/* /tmp/* ~/.cache/*
          df -h

      - name: 安装依赖
        run: |
          sudo apt update && sudo apt install -y --no-install-recommends git ccache python3 openjdk-11-jdk-headless gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev liblz4-tool imagemagick lzop
          sudo apt-mark manual ccache
          sudo apt clean

      - name: 配置repo工具
        run: |
          mkdir -p ~/bin
          curl -fsSL https://mirrors.tuna.tsinghua.edu.cn/git/git-repo -o ~/bin/repo || curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH="$HOME/bin:$PATH"

      - name: 同步源码并修复错误
        run: |
          export PATH="$HOME/bin:$PATH"
          mkdir -p $HOME/twrp && cd $HOME/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1
          repo sync -j2 --no-clone-bundle --optimized-fetch --no-tags
          git clone --depth=1 https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi device/zyb/tb8786p1_64_k510_wifi
          mkdir -p .repo/local_manifests
          echo '<?xml version="1.0" encoding="UTF-8"?><manifest><project path="device/zyb/tb8786p1_64_k510_wifi" name="WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi" remote="github" revision="main" /></manifest>' > .repo/local_manifests/roomservice.xml
          sudo chmod +w vendor/twrp/build/tools/roomservice.py
          # Base64编码单行写入Python脚本，彻底规避YAML解析冲突
          echo "" | base64 -d > vendor/twrp/build/tools/roomservice.py
          find . -name "*.mk" -type f -exec sed -i '/export PRODUCT_PROPERTY_OVERRIDES/d' {} \;
          find . -name "*.mk" -type f -exec sed -i 's/^PRODUCT_PROPERTY_OVERRIDES :=/PRODUCT_PROPERTY_OVERRIDES ?=/g' {} \;
          find device/zyb/tb8786p1_64_k510_wifi -name "BoardConfig.mk" -type f -exec sed -i '/PLATFORM_VERSION_ALL_CODENAMES :=/d' {} \;
          rm -rf .repo/.repo_cache ~/.repo/cache

      - name: 编译TWRP镜像
        run: |
          cd $HOME/twrp
          which ccache && ccache --version
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export ALLOW_MISSING_DEPENDENCIES=true
          ccache -M 5G
          source build/envsetup.sh
          lunch omni_tb8786p1_64_k510_wifi-eng
          make -j2 vendor_bootimage bootimage 2>&1 | tee build.log

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: tb8786p1_64_k510_wifi-twrp
          path: |
            $HOME/twrp/out/target/product/tb8786p1_64_k510_wifi/*.img
            $HOME/twrp/build.log
          retention-days: 7
