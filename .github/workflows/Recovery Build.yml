name: TWRP Builder
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Env Setup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          sudo apt update -y && sudo apt install -y git ccache python3 openjdk-11-jdk gcc-multilib g++-multilib lib32z1-dev lib32ncurses5-dev
          mkdir -p ~/bin
          curl -fsSL https://mirrors.tuna.tsinghua.edu.cn/git/git-repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo 'export PATH="$HOME/bin:$PATH"' >> ~/.bashrc
          source ~/.bashrc
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"

      - name: Source Sync & Fix
        run: |
          export PATH="$HOME/bin:$PATH"
          mkdir build && cd build
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1 --no-repo-verify
          repo sync -j2 --no-clone-bundle --quiet
          git clone https://github.com/WUNELEZI1/android_device_zyb_tb8786p1_64_k510_wifi -b main device/zyb/tb8786p1_64_k510_wifi --depth=1
          sed -i 's/BOARD_PLAT_PUBLIC_SEPOLICY_DIR/SYSTEM_EXT_PUBLIC_SEPOLICY_DIRS/g' device/zyb/tb8786p1_64_k510_wifi/BoardConfig.mk
          sed -i 's/BOARD_PLAT_PRIVATE_SEPOLICY_DIR/SYSTEM_EXT_PRIVATE_SEPOLICY_DIRS/g' device/zyb/tb8786p1_64_k510_wifi/BoardConfig.mk

      - name: Build TWRP
        run: |
          export PATH="$HOME/bin:$PATH"
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          cd build
          export ALLOW_MISSING_DEPENDENCIES=true USE_CCACHE=1
          export ANDROID_JACK_VM_ARGS="-Xmx4g -Dfile.encoding=UTF-8 -XX:+TieredCompilation"
          ccache -M 10G
          source build/envsetup.sh
          lunch omni_tb8786p1_64_k510_wifi-eng
          make -j1 vendor_bootimage -l 1.0

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: twrp-img
          path: build/out/target/product/tb8786p1_64_k510_wifi/*.img
